name: Release

# Publishes a GitHub Release when a version tag is pushed (or on manual
# dispatch for an existing tag). Gate: the full Foundry test suite must pass
# before the release is created. Release notes come from the annotated tag
# message plus auto-generated notes.
#
# The self-contained demo container (demo/Dockerfile) ships with every release:
# built from the tag, smoke-tested end to end (blocked -> approve -> execute),
# then pushed to ghcr.io/<owner>/fermionwallet-demo:<tag> (and :latest for
# non-prerelease tags). Its digest and run command are added to the notes.
#
# The Safe{Wallet} demo (demo/wallet) ships too: the prebuilt Safe{Wallet} UI
# image is pushed to ghcr.io/<owner>/fermionwallet-demo-wallet:<tag>, the whole
# Compose stack is tested in a real browser (demo/wallet/e2e), and a Compose
# bundle pinned to this release's images is attached to the release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          submodules: recursive

      # Same Foundry as demo/Dockerfile (FOUNDRY_VERSION): bump both together.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3

      - name: Build contracts
        working-directory: contracts
        run: forge build

      - name: Run test suite
        working-directory: contracts
        run: forge test -vv

      - name: Package contract binaries
        working-directory: contracts
        run: |
          DIST="fermionwallet-contracts-${TAG}"
          mkdir -p "dist/${DIST}/abi" "dist/${DIST}/bytecode" "dist/${DIST}/artifacts"
          # FermionWalletGuard is the only deployable contract: QuantumKeyRegistry and
          # PreApprovalEngine are abstract bases compiled into it (empty bytecode),
          # and its ABI already covers their functions.
          C=FermionWalletGuard
          ART="out/${C}.sol/${C}.json"
          # Full Foundry artifact (ABI + bytecode + metadata + source hashes)
          cp "${ART}" "dist/${DIST}/artifacts/${C}.json"
          jq '.abi' "${ART}" > "dist/${DIST}/abi/${C}.abi.json"
          jq -r '.bytecode.object' "${ART}" > "dist/${DIST}/bytecode/${C}.bin"
          jq -r '.deployedBytecode.object' "${ART}" > "dist/${DIST}/bytecode/${C}.deployed.bin"
          # Byte ranges the constructor fills in at deployment (immutables): needed to
          # compare a deployed Guard's runtime code against this release.
          jq '.deployedBytecode.immutableReferences' "${ART}" > "dist/${DIST}/bytecode/${C}.immutable-references.json"
          # Compiler settings needed to reproduce byte-identical binaries
          cp foundry.toml remappings.txt "dist/${DIST}/"
          {
            echo "tag: ${TAG}"
            echo "commit: $(git rev-parse HEAD)"
            echo "solc: $(jq -r '.metadata.compiler.version' out/FermionWalletGuard.sol/FermionWalletGuard.json)"
            echo
            echo "FermionWalletGuard runtime code hash, immutables zeroed:"
            echo "  $(cast keccak "$(jq -r '.deployedBytecode.object' "${ART}")")"
            echo
            echo "This is NOT the on-chain EXTCODEHASH. The constructor writes immutables into"
            echo "the runtime code (timelocks, MultiSendCallOnly, batch and queue caps, and the"
            echo "EIP-712 chain id / address / domain separator), so every deployment's"
            echo "EXTCODEHASH is different, including on each chain. To verify a deployed Guard:"
            echo "  1. fetch its runtime code (cast code <guard> --rpc-url <rpc>);"
            echo "  2. overwrite every byte range in bytecode/${C}.immutable-references.json with zeros;"
            echo "  3. keccak256 the result and compare with the hash above."
            echo "Record each deployment's actual EXTCODEHASH per chain in deployments.json."
          } > "dist/${DIST}/MANIFEST.txt"
          cd dist
          tar -czf "${DIST}.tar.gz" "${DIST}"
          zip -qr "${DIST}.zip" "${DIST}"
          sha256sum "${DIST}.tar.gz" "${DIST}.zip" > SHA256SUMS
          cat "${DIST}/MANIFEST.txt" SHA256SUMS

      - name: Extract annotated tag message
        run: |
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          {
            echo "## ${TAG}"
            echo
            # Subject and body only: %(contents) would also paste a signed tag's PGP signature.
            git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "${TAG}"
          } > release-notes.md

      # A manual dispatch may target a tag that already has a release (e.g. to publish
      # the demo images for it): then only replace its contract assets.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=(
            "contracts/dist/fermionwallet-contracts-${TAG}.tar.gz"
            "contracts/dist/fermionwallet-contracts-${TAG}.zip"
            "contracts/dist/SHA256SUMS"
          )
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber "${ASSETS[@]}"
            exit 0
          fi
          # Same rule as the images' :latest tag: a tag with a '-' (v1.0.0-rc.1) is a prerelease.
          PRERELEASE=()
          case "${TAG}" in *-*) PRERELEASE=(--prerelease) ;; esac
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "FermionWallet ${TAG}" \
            --notes-file release-notes.md \
            --generate-notes \
            --verify-tag \
            "${PRERELEASE[@]}" \
            "${ASSETS[@]}"

  demo-image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # append the image to the release notes
      packages: write # push to ghcr.io
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/fermionwallet-demo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=FermionWallet demo
            org.opencontainers.image.description=Local anvil chain with a real Safe, the FermionWallet Guard, a simulated Ledger and a web UI (standalone, or DEMO_MODE=wallet for the Safe{Wallet} stack)
            org.opencontainers.image.version=${{ env.TAG }}

      - name: Build demo image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: demo/Dockerfile
          load: true
          tags: fermionwallet-demo:smoke
          cache-to: type=gha,mode=max
          cache-from: type=gha

      - name: Smoke-test the demo end to end
        run: |
          docker run -d --name demo -p 8080:8080 fermionwallet-demo:smoke
          timeout 300 sh -c 'until docker logs demo 2>&1 | grep -qE "ready —|FATAL"; do sleep 2; done'
          docker logs demo 2>&1 | tail -5
          # grep -c reads all input: grep -q could exit first and SIGPIPE docker logs under pipefail.
          docker logs demo 2>&1 | grep -c "ready —" > /dev/null
          post() { curl -fsS -X POST "http://localhost:8080/api/$1" -H 'content-type: application/json' -d '{"amount": 1000}'; }
          dev() { curl -fsS -X POST http://localhost:8080/api/device/button -H 'content-type: application/json' -d "{\"button\": \"$1\"}"; }
          post blocked | tee /dev/stderr | grep -q '"outcome": "blocked"'
          # Approval goes through the simulated Ledger: page through every screen, then Approve.
          post approve > approve.json &
          timeout 60 sh -c 'until curl -fsS http://localhost:8080/api/device/screen | grep -q "\"active\": true"; do sleep 1; done'
          for i in 1 2 3 4 5 6 7; do dev next > /dev/null; done
          dev approve
          wait
          tee /dev/stderr < approve.json | grep -q '"outcome": "approved"'
          post execute | tee /dev/stderr | grep -q '"outcome": "executed"'
          docker rm -f demo

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push demo image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: demo/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Add the demo image to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json body -q .body > notes.md
          # A re-run for the same tag must not append the section twice.
          if grep -q "^## Demo container" notes.md; then exit 0; fi
          {
            echo
            echo "## Demo container"
            echo
            echo "A local chain with a real Safe v1.5.0 and this release's Guard, plus a web UI:"
            echo
            echo '```sh'
            echo "docker run --rm -p 8080:8080 -p 8545:8545 ${IMAGE}:${TAG}"
            echo '```'
            echo
            echo "Then open http://localhost:8080. Image digest: \`${IMAGE}@${DIGEST}\`"
          } >> notes.md
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --notes-file notes.md

  demo-wallet:
    needs: demo-image
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the Compose bundle, append to the release notes
      packages: write # push to ghcr.io
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      DEMO_IMAGE: ghcr.io/${{ github.repository_owner }}/fermionwallet-demo
      UI_IMAGE: ghcr.io/${{ github.repository_owner }}/fermionwallet-demo-wallet
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      # The safe-wallet-web build image alone is ~8 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.UI_IMAGE }}
          tags: |
            type=raw,value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=FermionWallet demo: Safe{Wallet}
            org.opencontainers.image.description=Prebuilt Safe{Wallet} web UI and reverse proxy for the FermionWallet Compose demo
            org.opencontainers.image.version=${{ env.TAG }}

      - name: Build the Safe{Wallet} UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: demo/wallet/ui.Dockerfile
          load: true
          tags: fermionwallet-demo-wallet:e2e

      # Also lets Compose pull the chain image the demo-image job just pushed.
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the Compose stack
        working-directory: demo/wallet
        env:
          FERMION_DEMO_IMAGE: ${{ env.DEMO_IMAGE }}:${{ env.TAG }}
          FERMION_WALLET_UI_IMAGE: fermionwallet-demo-wallet:e2e
        run: |
          docker compose up -d --wait --wait-timeout 600
          docker compose ps -a

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Browser end-to-end test on Safe{Wallet}
        working-directory: demo/wallet/e2e
        run: |
          npm ci
          mkdir -p screenshots
          SCREENSHOTS=screenshots CHROME="$(command -v google-chrome)" node e2e.js

      - name: Keep screenshots and service logs
        if: always()
        working-directory: demo/wallet
        run: docker compose logs --no-color > e2e/screenshots/compose.log 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-wallet-e2e
          path: demo/wallet/e2e/screenshots

      - name: Push the Safe{Wallet} UI image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: demo/wallet/ui.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Package the Compose bundle
        env:
          UI_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          B="fermionwallet-demo-wallet-${TAG}"
          mkdir -p "dist/${B}"
          cp -r demo/wallet/docker-compose.yml demo/wallet/env demo/wallet/bootstrap_cfg.py demo/wallet/README.md "dist/${B}/"
          DEMO_DIGEST="$(docker buildx imagetools inspect "${DEMO_IMAGE}:${TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          # Compose reads .env: pin this release's two images by digest.
          {
            echo "FERMION_DEMO_IMAGE=${DEMO_IMAGE}@${DEMO_DIGEST}"
            echo "FERMION_WALLET_UI_IMAGE=${UI_IMAGE}@${UI_DIGEST}"
          } > "dist/${B}/.env"
          cat "dist/${B}/.env"
          cd dist
          tar -czf "${B}.tar.gz" "${B}"
          sha256sum "${B}.tar.gz" > "${B}.tar.gz.sha256"

      - name: Attach the bundle and add it to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B="fermionwallet-demo-wallet-${TAG}"
          gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber "dist/${B}.tar.gz" "dist/${B}.tar.gz.sha256"
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json body -q .body > notes.md
          # A re-run for the same tag must not append the section twice.
          if grep -q "^## Demo on the real Safe{Wallet}" notes.md; then exit 0; fi
          {
            echo
            echo "## Demo on the real Safe{Wallet}"
            echo
            echo "The open-source Safe{Wallet} stack on a local chain, with FermionWallet as a Safe App"
            echo "and a simulated Ledger. Download \`${B}.tar.gz\` from the assets below, then:"
            echo
            echo '```sh'
            echo "tar -xzf ${B}.tar.gz && cd ${B}"
            echo "docker compose up -d --wait"
            echo '```'
            echo
            echo "Then open http://localhost:8000 and follow README.md in the bundle."
          } >> notes.md
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --notes-file notes.md
