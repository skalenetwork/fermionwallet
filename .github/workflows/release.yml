name: Release

# Publishes a GitHub Release when a version tag is pushed (or on manual
# dispatch for an existing tag). Gate: the full Foundry test suite must pass
# before the release is created. Release notes come from the annotated tag
# message plus auto-generated notes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Build contracts
        working-directory: contracts
        run: forge build

      - name: Run test suite
        working-directory: contracts
        run: forge test -vv

      - name: Package contract binaries
        working-directory: contracts
        run: |
          DIST="fermionwallet-contracts-${TAG}"
          mkdir -p "dist/${DIST}/abi" "dist/${DIST}/bytecode" "dist/${DIST}/artifacts"
          for C in FermionWalletGuard PreApprovalEngine QuantumKeyRegistry; do
            ART="out/${C}.sol/${C}.json"
            # Full Foundry artifact (ABI + bytecode + metadata + source hashes)
            cp "${ART}" "dist/${DIST}/artifacts/${C}.json"
            jq '.abi' "${ART}" > "dist/${DIST}/abi/${C}.abi.json"
            jq -r '.bytecode.object' "${ART}" > "dist/${DIST}/bytecode/${C}.bin"
            jq -r '.deployedBytecode.object' "${ART}" > "dist/${DIST}/bytecode/${C}.deployed.bin"
          done
          # Compiler settings needed to reproduce byte-identical binaries
          cp foundry.toml remappings.txt "dist/${DIST}/"
          {
            echo "tag: ${TAG}"
            echo "commit: $(git rev-parse HEAD)"
            echo "solc: $(jq -r '.metadata.compiler.version' out/FermionWalletGuard.sol/FermionWalletGuard.json)"
            echo
            echo "deployed codehashes (keccak256 of deployedBytecode):"
            for C in FermionWalletGuard PreApprovalEngine QuantumKeyRegistry; do
              HASH=$(cast keccak "$(jq -r '.deployedBytecode.object' "out/${C}.sol/${C}.json")")
              echo "  ${C}: ${HASH}"
            done
          } > "dist/${DIST}/MANIFEST.txt"
          cd dist
          tar -czf "${DIST}.tar.gz" "${DIST}"
          zip -qr "${DIST}.zip" "${DIST}"
          sha256sum "${DIST}.tar.gz" "${DIST}.zip" > SHA256SUMS
          cat "${DIST}/MANIFEST.txt" SHA256SUMS

      - name: Extract annotated tag message
        run: |
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          {
            echo "## ${TAG}"
            echo
            git tag -l --format='%(contents)' "${TAG}"
          } > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "FermionWallet ${TAG}" \
            --notes-file release-notes.md \
            --generate-notes \
            --verify-tag \
            "contracts/dist/fermionwallet-contracts-${TAG}.tar.gz" \
            "contracts/dist/fermionwallet-contracts-${TAG}.zip" \
            "contracts/dist/SHA256SUMS"
