name: Deploy product site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "app/**"
      - "assets/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/assets _site/app
          cp site/index.html _site/
          cp assets/fermionwallet-logo.svg _site/assets/
          cp -r assets/ui _site/assets/
          # Custom Safe App (manifest.json + UI + icon) at /app/
          cp app/index.html app/manifest.json _site/app/
          cp assets/fermionwallet-logo.svg _site/app/logo.svg
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
