name: Contracts

# On every push and pull request: the Guard, registry and engine test suites, and
# two checks that FermionGuard keeps using the XMSS verifier as proven:
#   - the pinned xmss-solidity submodule passes its own test suite here, so the
#     verifier FermionGuard compiles in is a commit its tests cover (its proof
#     runs in that repository's CI on every push);
#   - the registry verifies with the key's registered tree height (the
#     four-argument XMSS.verify), the form the proof recommends.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Same Foundry as demo/Dockerfile and release.yml: bump all together.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3

      - name: Guard, registry and engine tests
        working-directory: contracts
        run: forge test -vv

      - name: The pinned XMSS verifier passes its own tests
        working-directory: contracts/lib/xmss-solidity
        run: forge test

      - name: The Guard is compiled with the settings the XMSS proof covers
        # The proof (lib/xmss-solidity/PROOF.md) is of bytecode from one solc and one
        # optimizer configuration. The Guard must build with the same ones, or it
        # compiles the proven source into unproven bytes without anything failing.
        working-directory: contracts
        run: |
          lib=lib/xmss-solidity/foundry.toml
          for key in solc_version via_ir optimizer_runs; do
            want=$(grep -E "^$key" "$lib" | head -1 | sed 's/ //g')
            have=$(grep -E "^$key" foundry.toml | head -1 | sed 's/ //g')
            [ "$want" = "$have" ] || { echo "contracts/foundry.toml has '$have', the proven configuration is '$want'"; exit 1; }
          done

      - name: Every requirement the tests cite is a requirement that exists
        # The specifications tag their normative sentences [QKR-###] / [GRD-###] /
        # [ENG-###]; the tests cite those tags in `Covers:` annotations. A citation of
        # an ID no document defines — a typo, or a requirement deleted from a spec
        # while its test kept claiming it — fails here. Uncovered requirements are
        # printed, not fatal: the report is the honest state of the proof effort.
        working-directory: contracts
        run: python3 script/check_requirements.py

      - name: The EIP drafts still describe the contracts they claim to
        # eips/ERCS/*.md are the specifications restated as standards. Every error, event,
        # EIP-712 type string, interface signature and quoted constant in them must exist in
        # the Solidity, byte for byte — otherwise a draft promises an interface nobody can
        # call. Also checks the EIP-1 preamble and section rules the editors' linter enforces.
        run: python3 eips/check_eips.py

      - name: The registry binds the key's tree height when verifying
        working-directory: contracts
        run: |
          grep -qE 'XMSS\.verify\(digest, sig, XMSS\.PublicKey\(\{root: k\.xmssRoot, seed: k\.xmssSeed\}\), k\.treeHeight\)' src/QuantumKeyRegistry.sol \
            || { echo "QuantumKeyRegistry must call the four-argument XMSS.verify with the registered treeHeight"; exit 1; }
