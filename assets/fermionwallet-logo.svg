<svg width="520" height="360" viewBox="0 0 520 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FermionWallet logo: a fermion holding a quantum">
  <defs>
    <radialGradient id="bodyGrad" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#7f9cf5"/>
      <stop offset="55%" stop-color="#4c51bf"/>
      <stop offset="100%" stop-color="#1a1f4b"/>
    </radialGradient>
    <radialGradient id="quantumGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fefcbf"/>
      <stop offset="40%" stop-color="#68f0d0"/>
      <stop offset="100%" stop-color="#0bc5ea" stop-opacity="0.15"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#68f0d0"/>
      <stop offset="100%" stop-color="#7f9cf5"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="520" height="360" rx="24" fill="#0b1020"/>

  <!-- faint starfield -->
  <g fill="#ffffff" opacity="0.35">
    <circle cx="60" cy="50" r="1.5"/>
    <circle cx="470" cy="70" r="1.2"/>
    <circle cx="420" cy="300" r="1.4"/>
    <circle cx="90" cy="300" r="1.1"/>
    <circle cx="250" cy="30" r="1.3"/>
    <circle cx="500" cy="180" r="1.0"/>
    <circle cx="30" cy="180" r="1.0"/>
  </g>

  <!-- orbital rings around the fermion (spin-1/2 vibes) -->
  <g fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.8">
    <ellipse cx="230" cy="185" rx="150" ry="55" transform="rotate(-18 230 185)"/>
    <ellipse cx="230" cy="185" rx="150" ry="55" transform="rotate(38 230 185)"/>
  </g>
  <!-- electrons on the rings -->
  <circle cx="93" cy="223" r="6" fill="#68f0d0" filter="url(#glow)"/>
  <circle cx="345" cy="93" r="6" fill="#7f9cf5" filter="url(#glow)"/>

  <!-- fermion body -->
  <circle cx="230" cy="185" r="78" fill="url(#bodyGrad)"/>
  <!-- subtle highlight -->
  <ellipse cx="205" cy="155" rx="30" ry="18" fill="#ffffff" opacity="0.18"/>

  <!-- face -->
  <g>
    <!-- eyes -->
    <circle cx="205" cy="175" r="8" fill="#0b1020"/>
    <circle cx="248" cy="175" r="8" fill="#0b1020"/>
    <circle cx="208" cy="172" r="2.6" fill="#ffffff"/>
    <circle cx="251" cy="172" r="2.6" fill="#ffffff"/>
    <!-- confident smile -->
    <path d="M203 205 Q227 224 251 203" stroke="#0b1020" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- left arm resting -->
  <path d="M162 210 Q130 232 140 258" stroke="#4c51bf" stroke-width="14" fill="none" stroke-linecap="round"/>

  <!-- right arm holding the quantum aloft -->
  <path d="M295 160 Q340 130 368 108" stroke="#4c51bf" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- hand -->
  <circle cx="371" cy="105" r="10" fill="#4c51bf"/>

  <!-- the quantum: glowing wave-packet orb -->
  <g filter="url(#glow)">
    <circle cx="392" cy="78" r="34" fill="url(#quantumGrad)"/>
    <!-- psi wave inside -->
    <path d="M368 78 q6 -16 12 0 t12 0 t12 0 t12 0"
          stroke="#0b1020" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- superposition sparkles -->
    <circle cx="366" cy="52" r="2.5" fill="#fefcbf"/>
    <circle cx="422" cy="60" r="2" fill="#68f0d0"/>
    <circle cx="418" cy="102" r="2.2" fill="#7f9cf5"/>
  </g>

  <!-- h-bar tag floating near the quantum -->
  <text x="428" y="42" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#68f0d0">&#8463;</text>

  <!-- feet -->
  <ellipse cx="205" cy="268" rx="16" ry="8" fill="#1a1f4b"/>
  <ellipse cx="255" cy="268" rx="16" ry="8" fill="#1a1f4b"/>

  <!-- wordmark -->
  <text x="260" y="330" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="1">
    Fermion<tspan fill="#68f0d0">Wallet</tspan>
  </text>
</svg>
