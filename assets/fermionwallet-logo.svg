<svg width="520" height="360" viewBox="0 0 520 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FermionWallet logo: a fermion holding a quantum in cupped hands">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1a2f"/>
      <stop offset="100%" stop-color="#0a1220"/>
    </linearGradient>
    <radialGradient id="bodyGrad" cx="42%" cy="36%" r="72%">
      <stop offset="0%" stop-color="#3f6ea5"/>
      <stop offset="60%" stop-color="#1f4571"/>
      <stop offset="100%" stop-color="#122a47"/>
    </radialGradient>
    <radialGradient id="quantumGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#e8fbf7"/>
      <stop offset="45%" stop-color="#57d6c0"/>
      <stop offset="100%" stop-color="#2a9d8f" stop-opacity="0.12"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#57d6c0"/>
      <stop offset="100%" stop-color="#3f6ea5"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="520" height="360" rx="16" fill="url(#bgGrad)"/>
  <!-- thin corporate keyline -->
  <rect x="10" y="10" width="500" height="340" rx="12" fill="none" stroke="#2c4a6e" stroke-width="1" opacity="0.6"/>

  <!-- orbital rings: precise, engineering-drawing style -->
  <g fill="none" stroke="url(#ringGrad)" stroke-width="2" opacity="0.55">
    <ellipse cx="255" cy="180" rx="148" ry="52" transform="rotate(-16 255 180)"/>
    <ellipse cx="255" cy="180" rx="148" ry="52" transform="rotate(36 255 180)"/>
  </g>
  <!-- electrons on the rings -->
  <circle cx="122" cy="216" r="4.5" fill="#57d6c0" filter="url(#softGlow)"/>
  <circle cx="366" cy="96" r="4.5" fill="#3f6ea5" filter="url(#softGlow)"/>

  <!-- fermion body -->
  <circle cx="255" cy="180" r="74" fill="url(#bodyGrad)"/>
  <ellipse cx="232" cy="152" rx="27" ry="15" fill="#ffffff" opacity="0.10"/>

  <!-- composed, confident face -->
  <g>
    <!-- calm eyes -->
    <circle cx="232" cy="168" r="7" fill="#0a1220"/>
    <circle cx="274" cy="168" r="7" fill="#0a1220"/>
    <circle cx="234.5" cy="165.5" r="2.2" fill="#ffffff"/>
    <circle cx="276.5" cy="165.5" r="2.2" fill="#ffffff"/>
    <!-- confident smile (as in the original mark) -->
    <path d="M230 196 Q253 214 278 194" stroke="#0a1220" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- both arms forward, hands cupped, presenting the quantum -->
  <path d="M202 224 Q170 244 166 216 Q164 196 186 184" stroke="#1f4571" stroke-width="13" fill="none" stroke-linecap="round"/>
  <path d="M308 224 Q340 244 344 216 Q346 196 324 184" stroke="#1f4571" stroke-width="13" fill="none" stroke-linecap="round"/>
  <!-- cupped hands -->
  <g fill="#1f4571">
    <circle cx="189" cy="180" r="8"/>
    <circle cx="200" cy="171" r="6"/>
    <circle cx="321" cy="180" r="8"/>
    <circle cx="310" cy="171" r="6"/>
  </g>

  <!-- the quantum: precise glowing orb held just above the cupped hands -->
  <g filter="url(#softGlow)">
    <circle cx="255" cy="112" r="33" fill="url(#quantumGrad)"/>
    <!-- psi wave inside -->
    <path d="M231 112 q6 -15 12 0 t12 0 t12 0 t12 0"
          stroke="#0a1220" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- fine containment ring around the quantum: custody, not chaos -->
  <circle cx="255" cy="112" r="42" fill="none" stroke="#57d6c0" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.7"/>

  <!-- h-bar mark, understated -->
  <text x="306" y="76" font-family="Georgia, serif" font-style="italic" font-size="18" fill="#57d6c0" opacity="0.9">&#8463;</text>

  <!-- feet -->
  <ellipse cx="226" cy="260" rx="15" ry="7" fill="#122a47"/>
  <ellipse cx="284" cy="260" rx="15" ry="7" fill="#122a47"/>

  <!-- baseline rule -->
  <line x1="80" y1="288" x2="440" y2="288" stroke="#2c4a6e" stroke-width="1" opacity="0.7"/>

  <!-- wordmark -->
  <text x="260" y="322" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" letter-spacing="2">
    FERMION<tspan fill="#57d6c0">WALLET</tspan>
  </text>
  <text x="260" y="342" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8fa9c4" letter-spacing="3">
    QUANTUM-READY INSTITUTIONAL CUSTODY
  </text>
</svg>
