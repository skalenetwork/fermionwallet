<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="860" height="420" fill="#0c1626"/>
  <!-- dimmed queue behind -->
  <g opacity="0.25">
    <rect width="860" height="56" fill="#16263f"/>
    <rect x="30" y="76" width="800" height="60" rx="10" fill="#16263f"/>
    <rect x="30" y="148" width="800" height="60" rx="10" fill="#16263f"/>
  </g>
  <!-- modal -->
  <rect x="90" y="70" width="680" height="310" rx="14" fill="#16263f" stroke="#f2b84b" stroke-width="2"/>
  <text x="120" y="108" fill="#f2b84b" font-size="17" font-weight="800">⚠ Authorize out of order?</text>
  <text x="120" y="140" fill="#e8eef7" font-size="13.5">Nonce #42 is still unapproved. This approval (nonce #43) cannot execute until #42 clears.</text>
  <rect x="120" y="156" width="620" height="76" rx="8" fill="#0c1626"/>
  <text x="140" y="182" fill="#8fa3bf" font-size="12.5">Queue ahead of #43: 1 transaction · estimated <tspan fill="#f2b84b" font-weight="700">~9 h</tspan> to clear</text>
  <text x="140" y="202" fill="#8fa3bf" font-size="12.5">Your chosen validity window: <tspan fill="#f2b84b" font-weight="700">6 h</tspan> — this approval will likely <tspan fill="#e05555" font-weight="700">expire unexecuted</tspan></text>
  <text x="140" y="222" fill="#e05555" font-size="12.5" font-weight="700">Cost if it expires: leaf #184,205 is burned and the full review happens again.</text>
  <text x="120" y="262" fill="#8fa3bf" font-size="12.5">This override is recorded in the audit log with your identity, the queue state, and the estimate you overrode.</text>
  <text x="120" y="292" fill="#e8eef7" font-size="13" font-weight="600">Type the nonce number (43) to confirm — clicking alone is not enough:</text>
  <rect x="120" y="304" width="110" height="32" rx="6" fill="#0c1626" stroke="#f2b84b" stroke-width="1"/>
  <text x="160" y="326" fill="#e8eef7" font-size="14" font-weight="700">4 3</text>
  <rect x="250" y="304" width="200" height="32" rx="16" fill="#f2b84b"/>
  <text x="272" y="325" fill="#0c1626" font-size="13" font-weight="700">Authorize out of order</text>
  <rect x="466" y="304" width="110" height="32" rx="16" fill="none" stroke="#8fa3bf" stroke-width="1.2"/>
  <text x="497" y="325" fill="#8fa3bf" font-size="13">Cancel</text>
  <text x="90" y="406" fill="#5b7292" font-size="11.5">Full-screen modal, not a checkbox: the cost is stated in concrete terms (time estimate, leaf number) before the override is possible.</text>
</svg>
