<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="860" height="440" fill="#0c1626"/>
  <rect width="860" height="56" fill="#16263f"/>
  <circle cx="34" cy="28" r="14" fill="#57d6c0"/>
  <text x="58" y="34" fill="#e8eef7" font-size="17" font-weight="700">FERMIONWALLET</text>
  <text x="250" y="34" fill="#8fa3bf" font-size="14">Owner signing session</text>
  <text x="660" y="34" fill="#f2b84b" font-size="13">Session expires in 41 h 12 m</text>
  <!-- identity -->
  <rect x="30" y="76" width="800" height="64" rx="10" fill="#16263f"/>
  <text x="52" y="104" fill="#e8eef7" font-size="15" font-weight="700">You were invited to co-sign a quantum key registration for Safe 0x9aF3…C21e</text>
  <text x="52" y="126" fill="#8fa3bf" font-size="12.5">Signed in as owner alice.eth (0x2B77…4c10) via Sign-In-With-Ethereum · not you? Switch wallet</text>
  <!-- verify words -->
  <rect x="30" y="156" width="800" height="120" rx="10" fill="#16263f"/>
  <text x="52" y="184" fill="#57d6c0" font-size="13" font-weight="700">STEP 1 — VERIFY THE CEREMONY CODE OUT-OF-BAND</text>
  <rect x="52" y="198" width="420" height="38" rx="8" fill="#0c1626" stroke="#57d6c0" stroke-width="1"/>
  <text x="70" y="222" fill="#57d6c0" font-size="14" font-weight="700">orbit · velvet · canyon · lemon · tiger · frost</text>
  <text x="52" y="260" fill="#8fa3bf" font-size="12.5">Call the Administrator on a channel other than the one that delivered this link. Read the six words aloud. Do not sign if they differ.</text>
  <!-- sign -->
  <rect x="30" y="292" width="800" height="96" rx="10" fill="#16263f"/>
  <text x="52" y="320" fill="#57d6c0" font-size="13" font-weight="700">STEP 2 — SIGN THE REGISTRATION</text>
  <text x="52" y="344" fill="#8fa3bf" font-size="12.5">Your wallet will show the full key root and the Safe address — EIP-712 ApproveQuantumKey, chain 1, registry nonce 7. Any EIP-712-capable owner wallet works (hardware or software).</text>
  <rect x="52" y="356" width="190" height="26" rx="13" fill="#57d6c0"/>
  <text x="82" y="374" fill="#0c1626" font-size="12.5" font-weight="700">Sign with my wallet</text>
  <rect x="256" y="356" width="150" height="26" rx="13" fill="none" stroke="#8fa3bf" stroke-width="1"/>
  <text x="278" y="374" fill="#8fa3bf" font-size="12.5">Decline &amp; notify</text>
  <text x="30" y="424" fill="#5b7292" font-size="11.5">Progress is saved server-side: closing this page loses nothing — the link resumes here. 2 of 3 owners have signed; the session aborts harmlessly if it expires.</text>
</svg>
