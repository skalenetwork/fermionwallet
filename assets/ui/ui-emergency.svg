<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="860" height="440" fill="#0c1626"/>
  <rect width="860" height="56" fill="#16263f"/>
  <circle cx="34" cy="28" r="14" fill="#57d6c0"/>
  <text x="58" y="34" fill="#e8eef7" font-size="17" font-weight="700">FERMIONWALLET</text>
  <text x="250" y="34" fill="#8fa3bf" font-size="14">Approvals</text>
  <text x="340" y="34" fill="#57d6c0" font-size="14" font-weight="600">Emergency</text>
  <text x="700" y="34" fill="#8fa3bf" font-size="13">Safe: 0x9aF3…C21e</text>
  <text x="30" y="92" fill="#e8eef7" font-size="20" font-weight="700">Emergency Guard removal — owners only, no quantum key</text>
  <text x="30" y="114" fill="#8fa3bf" font-size="13">For a lost, destroyed, or compromised Administrator device. Requires the normal owner threshold, nothing else.</text>
  <!-- status card -->
  <rect x="30" y="132" width="800" height="120" rx="10" fill="#2b1c1c" stroke="#e05555" stroke-width="1.5"/>
  <text x="52" y="164" fill="#e05555" font-size="15" font-weight="700">🔴 Emergency removal ACTIVE — initiated by alice.eth · 3-of-3 owners signed</text>
  <text x="52" y="190" fill="#e8eef7" font-size="14">Guard removal executable in <tspan font-weight="700">11 d 06 h 42 m</tspan> (14-day owners-only timelock)</text>
  <text x="52" y="214" fill="#c9a0a8" font-size="12.5">Every owner, the Administrator, and all configured alert channels were notified when this started.</text>
  <text x="52" y="236" fill="#c9a0a8" font-size="12.5">The Administrator can cancel at any time during the countdown by signing a cancellation on the enrolled Ledger.</text>
  <!-- timeline -->
  <rect x="30" y="268" width="800" height="74" rx="10" fill="#16263f"/>
  <text x="52" y="296" fill="#e8eef7" font-size="14" font-weight="700">Timeline</text>
  <rect x="52" y="308" width="756" height="10" rx="5" fill="#22354f"/>
  <rect x="52" y="308" width="150" height="10" rx="5" fill="#e05555"/>
  <text x="52" y="336" fill="#5b7292" font-size="11.5">Day 0 — initiated · Day 3 of 14 · executes no earlier than 04 Oct 2026 09:12 UTC · cancellation possible until execution</text>
  <!-- actions -->
  <rect x="30" y="362" width="250" height="38" rx="19" fill="none" stroke="#e05555" stroke-width="1.5"/>
  <text x="56" y="386" fill="#e05555" font-size="13.5" font-weight="600">Cancel emergency removal</text>
  <rect x="298" y="362" width="230" height="38" rx="19" fill="#3a2f14"/>
  <text x="322" y="386" fill="#f2b84b" font-size="13.5" font-weight="600">View owner signatures</text>
  <text x="30" y="426" fill="#5b7292" font-size="12">Not in an emergency? Use the normal 48-hour quantum-approved removal instead — it is faster. This path exists so a dead Ledger can never brick your Safe.</text>
