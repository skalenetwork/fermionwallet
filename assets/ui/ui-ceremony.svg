<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="860" height="560" fill="#0c1626"/>
  <rect width="860" height="56" fill="#16263f"/>
  <circle cx="34" cy="28" r="14" fill="#57d6c0"/>
  <text x="58" y="34" fill="#e8eef7" font-size="17" font-weight="700">FERMIONWALLET</text>
  <text x="250" y="34" fill="#8fa3bf" font-size="14">Approvals</text>
  <text x="340" y="34" fill="#57d6c0" font-size="14" font-weight="600">Quantum key</text>
  <text x="700" y="34" fill="#8fa3bf" font-size="13">Safe: 0x9aF3…C21e</text>
  <!-- wizard steps -->
  <text x="30" y="92" fill="#e8eef7" font-size="20" font-weight="700">Key ceremony — Stage C of E</text>
  <g font-size="12">
    <circle cx="46" cy="120" r="11" fill="#4bd18a"/><text x="42" y="125" fill="#0c1626" font-weight="700">A</text>
    <rect x="60" y="118" width="60" height="4" fill="#4bd18a"/>
    <circle cx="134" cy="120" r="11" fill="#4bd18a"/><text x="130" y="125" fill="#0c1626" font-weight="700">B</text>
    <rect x="148" y="118" width="60" height="4" fill="#4bd18a"/>
    <circle cx="222" cy="120" r="11" fill="#57d6c0"/><text x="218" y="125" fill="#0c1626" font-weight="700">C</text>
    <rect x="236" y="118" width="60" height="4" fill="#22354f"/>
    <circle cx="310" cy="120" r="11" fill="#22354f"/><text x="306" y="125" fill="#8fa3bf" font-weight="700">D</text>
    <rect x="324" y="118" width="60" height="4" fill="#22354f"/>
    <circle cx="398" cy="120" r="11" fill="#22354f"/><text x="394" y="125" fill="#8fa3bf" font-weight="700">E</text>
    <text x="440" y="125" fill="#5b7292">Preflight · Generate · Collect signatures · Activate · Proof of life</text>
  </g>
  <!-- ceremony code -->
  <rect x="30" y="150" width="800" height="120" rx="10" fill="#16263f"/>
  <text x="52" y="180" fill="#8fa3bf" font-size="12">CEREMONY CODE — verify with each owner out-of-band (call or video, not chat)</text>
  <text x="52" y="222" fill="#57d6c0" font-size="26" font-weight="700" letter-spacing="1">orbit · velvet · canyon · lemon · tiger · frost</text>
  <text x="52" y="252" fill="#5b7292" font-size="12">XMSS root 0x8c41 f2a9 … 77b3 0d6e · XMSS-SHA2_20_256 · ~1,048,576 lifetime approvals</text>
  <!-- quorum tracker -->
  <rect x="30" y="286" width="800" height="180" rx="10" fill="#16263f"/>
  <text x="52" y="316" fill="#e8eef7" font-size="15" font-weight="700">Owner signatures — 2 of 3 · expires in 41 h</text>
  <rect x="52" y="330" width="756" height="10" rx="5" fill="#22354f"/>
  <rect x="52" y="330" width="504" height="10" rx="5" fill="#57d6c0"/>
  <g font-size="13.5">
    <circle cx="62" cy="372" r="8" fill="#4bd18a"/>
    <text x="82" y="377" fill="#e8eef7">alice.eth — signed on Ledger Nano X · 14:02 UTC</text>
    <circle cx="62" cy="402" r="8" fill="#4bd18a"/>
    <text x="82" y="407" fill="#e8eef7">0x33Ba…D410 — signed on Ledger Stax · 14:36 UTC</text>
    <circle cx="62" cy="432" r="8" fill="none" stroke="#f2b84b" stroke-width="2"/>
    <text x="82" y="437" fill="#f2b84b">bob.eth — pending · reminder sent 15:00 UTC</text>
  </g>
  <rect x="640" y="418" width="168" height="30" rx="15" fill="none" stroke="#8fa3bf" stroke-width="1.2"/>
  <text x="668" y="438" fill="#8fa3bf" font-size="13">Send reminder</text>
  <!-- footer -->
  <rect x="30" y="482" width="150" height="40" rx="20" fill="none" stroke="#e05555" stroke-width="1.5"/>
  <text x="66" y="507" fill="#e05555" font-size="14" font-weight="600">Abort ceremony</text>
  <text x="200" y="507" fill="#5b7292" font-size="11.5">Owners sign the full root on their own device — the signature is invalid for any other root, chain, Safe, or ceremony.</text>
</svg>
