<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="860" height="480" fill="#0c1626"/>
  <rect width="860" height="56" fill="#16263f"/>
  <circle cx="34" cy="28" r="14" fill="#57d6c0"/>
  <text x="58" y="34" fill="#e8eef7" font-size="17" font-weight="700">FERMIONWALLET</text>
  <text x="700" y="34" fill="#8fa3bf" font-size="13">Safe: 0x9aF3…C21e</text>
  <!-- admin banner -->
  <rect x="30" y="76" width="800" height="52" rx="10" fill="#3a1a1a"/>
  <text x="52" y="108" fill="#e05555" font-size="16" font-weight="800">⚠ ADMINISTRATIVE ACTION — affects Safe governance</text>
  <!-- payload -->
  <rect x="30" y="142" width="800" height="150" rx="10" fill="#16263f"/>
  <text x="52" y="172" fill="#8fa3bf" font-size="12">DECODED SELF-CALL</text>
  <text x="52" y="198" fill="#e8eef7" font-size="17" font-weight="700">setGuard(0x0000…0000) — REMOVES THE FERMIONWALLET GUARD</text>
  <text x="52" y="230" fill="#8fa3bf" font-size="12">CLASS / TIMELOCK</text>
  <text x="52" y="252" fill="#e8eef7" font-size="14">ADMIN pre-approval · ADMIN_TIMELOCK 48 h · payload hash 0x9c2e…41aa</text>
  <text x="52" y="276" fill="#5b7292" font-size="12">Every owner has been notified. The action cannot execute before the countdown ends.</text>
  <!-- countdown -->
  <rect x="30" y="306" width="520" height="96" rx="10" fill="#16263f"/>
  <text x="52" y="336" fill="#8fa3bf" font-size="12">EXECUTABLE IN</text>
  <text x="52" y="376" fill="#f2b84b" font-size="30" font-weight="800">47 h 12 m 09 s</text>
  <rect x="52" y="388" width="456" height="6" rx="3" fill="#22354f"/>
  <rect x="52" y="388" width="10" height="6" rx="3" fill="#f2b84b"/>
  <!-- revoke -->
  <rect x="570" y="306" width="260" height="96" rx="10" fill="#16263f"/>
  <rect x="592" y="322" width="216" height="32" rx="16" fill="#e05555"/>
  <text x="646" y="343" fill="#ffffff" font-size="13.5" font-weight="700">Revoke now</text>
  <rect x="592" y="360" width="216" height="28" rx="14" fill="none" stroke="#e05555" stroke-width="1.5"/>
  <text x="640" y="379" fill="#e05555" font-size="12.5" font-weight="600">Revoke as owner</text>
  <text x="30" y="418" fill="#5b7292" font-size="11">Administrator: "Revoke now" signs on the enrolled Ledger. Any single owner: "Revoke as owner" signs with the normal owner key — either alone cancels the action for the full delay.</text>
  <text x="30" y="440" fill="#5b7292" font-size="11.5">The timelock exists so a stolen quantum key alone cannot silently remove the Guard: owners see the AdminPreApprovalCreated event and have 48 hours to revoke.</text>
</svg>
