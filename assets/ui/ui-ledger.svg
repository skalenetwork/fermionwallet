<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="860" height="400" fill="#0c1626"/>
  <text x="30" y="44" fill="#e8eef7" font-size="18" font-weight="700">Ledger XMSS app — signing flow (screens 1, 3, 4, 8 of 8)</text>
  <!-- device 1 -->
  <g>
    <rect x="30" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#22354f" stroke-width="2"/>
    <rect x="48" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="60" y="122" fill="#57d6c0" font-size="11" font-weight="700">SIGN APPROVAL</text>
    <text x="60" y="150" fill="#e8eef7" font-size="12">Leaf #184,204</text>
    <text x="60" y="168" fill="#8fa3bf" font-size="10.5">of 1,048,576</text>
    <text x="60" y="200" fill="#8fa3bf" font-size="10.5">Transfer class</text>
    <text x="60" y="262" fill="#5b7292" font-size="9.5">Screen 1 · header</text>
    <circle cx="122" cy="312" r="12" fill="#22354f"/>
  </g>
  <!-- device 2 -->
  <g>
    <rect x="235" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#22354f" stroke-width="2"/>
    <rect x="253" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="265" y="122" fill="#57d6c0" font-size="11" font-weight="700">AMOUNT</text>
    <text x="265" y="152" fill="#e8eef7" font-size="13" font-weight="700">500,000.00</text>
    <text x="265" y="170" fill="#e8eef7" font-size="13" font-weight="700">USDC</text>
    <text x="265" y="200" fill="#8fa3bf" font-size="9.5">raw: 500000000000</text>
    <text x="265" y="262" fill="#5b7292" font-size="9.5">Screen 3 · amount</text>
    <circle cx="327" cy="312" r="12" fill="#22354f"/>
  </g>
  <!-- device 3 -->
  <g>
    <rect x="440" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#22354f" stroke-width="2"/>
    <rect x="458" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="470" y="122" fill="#57d6c0" font-size="11" font-weight="700">RECIPIENT 1/3</text>
    <text x="470" y="150" fill="#e8eef7" font-size="11.5">0x7bE1 4C09</text>
    <text x="470" y="168" fill="#e8eef7" font-size="11.5">aa31 08D2</text>
    <text x="470" y="186" fill="#e8eef7" font-size="11.5">55f1 9E77 …</text>
    <text x="470" y="214" fill="#8fa3bf" font-size="9.5">full address, never</text>
    <text x="470" y="228" fill="#8fa3bf" font-size="9.5">truncated</text>
    <text x="470" y="262" fill="#5b7292" font-size="9.5">Screen 4 · recipient</text>
    <circle cx="532" cy="312" r="12" fill="#22354f"/>
  </g>
  <!-- device 4 -->
  <g>
    <rect x="645" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#22354f" stroke-width="2"/>
    <rect x="663" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="675" y="122" fill="#57d6c0" font-size="11" font-weight="700">APPROVE?</text>
    <text x="675" y="150" fill="#e8eef7" font-size="11.5">Hold to approve</text>
    <text x="675" y="176" fill="#e05555" font-size="11.5">Tap to reject</text>
    <text x="675" y="210" fill="#8fa3bf" font-size="9.5">counter commits</text>
    <text x="675" y="224" fill="#8fa3bf" font-size="9.5">before signature</text>
    <text x="675" y="262" fill="#5b7292" font-size="9.5">Screen 8 · decision</text>
    <circle cx="737" cy="312" r="12" fill="#57d6c0"/>
  </g>
  <text x="30" y="374" fill="#5b7292" font-size="11.5">The device screen is the final authority: what you confirm here is exactly what the Guard enforces on-chain. Reject is always the easiest physical action.</text>
</svg>
