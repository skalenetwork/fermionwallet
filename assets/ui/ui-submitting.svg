  <text x="694" y="336" fill="#ffffff" font-size="13" font-weight="700">Re-approve</text>
  <text x="30" y="424" fill="#5b7292" font-size="11.5">A Ledger-signed approval that never confirmed is flagged loudly, never dropped: the device counter has already advanced, so the audit log records the leaf either way.</text>
