  <!-- state 2: confirmed -->
  <rect x="30" y="208" width="800" height="72" rx="10" fill="#16263f"/>
  <circle cx="58" cy="244" r="9" fill="#4bd18a"/>
  <text x="82" y="236" fill="#e8eef7" font-size="15" font-weight="600">#42 · 500,000.00 USDC → 0x7bE1…9A04</text>
  <text x="82" y="260" fill="#8fa3bf" font-size="12.5">🟢 Confirmed in block 20,148,114 · executable until 21:40 UTC · operators notified</text>
  <rect x="688" y="228" width="122" height="30" rx="15" fill="#22354f"/>
  <text x="713" y="248" fill="#4bd18a" font-size="13" font-weight="700">Ready ✓</text>
  <!-- state 3: revert -->
  <rect x="30" y="292" width="800" height="96" rx="10" fill="#16263f" stroke="#e05555" stroke-width="1.5"/>
  <circle cx="58" cy="332" r="9" fill="#e05555"/>
