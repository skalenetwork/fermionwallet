  <text x="82" y="164" fill="#8fa3bf" font-size="12.5">⏳ Submitting pre-approval · simulated ✓ · tx 0x91cc…07d4 · waiting for confirmation (block 20,148,112)</text>
  <text x="82" y="184" fill="#5b7292" font-size="11.5">Leaf #184,204 already committed on the device — this submission will be retried automatically, never re-signed</text>
  <rect x="688" y="124" width="122" height="30" rx="15" fill="#22354f"/>
