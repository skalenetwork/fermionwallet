<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="860" height="520" fill="#0c1626"/>
  <rect width="860" height="56" fill="#16263f"/>
  <circle cx="34" cy="28" r="14" fill="#57d6c0"/>
  <text x="58" y="34" fill="#e8eef7" font-size="17" font-weight="700">FERMIONWALLET</text>
  <text x="250" y="34" fill="#57d6c0" font-size="14" font-weight="600">Approvals</text>
  <text x="700" y="34" fill="#8fa3bf" font-size="13">Safe: 0x9aF3…C21e</text>
  <text x="30" y="90" fill="#e8eef7" font-size="18" font-weight="700">Denying a transfer — reason, Ledger, confirmation</text>
  <!-- step 1: reason modal -->
  <rect x="30" y="108" width="800" height="160" rx="10" fill="#16263f" stroke="#e05555" stroke-width="1.5"/>
  <text x="52" y="136" fill="#e05555" font-size="13" font-weight="700">DENY #42 · 500,000.00 USDC → 0x7bE1…9A04</text>
  <text x="52" y="160" fill="#8fa3bf" font-size="12.5">A reason is required — an unexplained veto is unactionable for operators. Quick-picks:</text>
  <rect x="52" y="172" width="150" height="26" rx="13" fill="#3a1a1a"/><text x="66" y="190" fill="#e05555" font-size="12">unverified recipient</text>
  <rect x="212" y="172" width="132" height="26" rx="13" fill="#22354f"/><text x="228" y="190" fill="#8fa3bf" font-size="12">amount anomaly</text>
  <rect x="354" y="172" width="120" height="26" rx="13" fill="#22354f"/><text x="370" y="190" fill="#8fa3bf" font-size="12">policy question</text>
  <rect x="484" y="172" width="148" height="26" rx="13" fill="#22354f"/><text x="500" y="190" fill="#8fa3bf" font-size="12">suspected phishing</text>
  <rect x="52" y="210" width="580" height="30" rx="6" fill="#0c1626" stroke="#22354f" stroke-width="1"/>
  <text x="64" y="230" fill="#e8eef7" font-size="12">Recipient unreachable on the verified phone number — refusing until confirmed.</text>
  <rect x="650" y="210" width="158" height="30" rx="15" fill="#e05555"/>
  <text x="672" y="230" fill="#ffffff" font-size="12.5" font-weight="700">Confirm on Ledger →</text>
  <!-- step 2: recording -->
  <rect x="30" y="284" width="800" height="60" rx="10" fill="#16263f"/>
  <text x="52" y="310" fill="#8fa3bf" font-size="12.5">⏳ Recording denial… waiting for the Ledger DENY confirmation (red screen, ECDSA only — no leaf consumed)</text>
  <text x="52" y="330" fill="#5b7292" font-size="11.5">See ledger-ui.md for the on-device DENY flow</text>
  <!-- step 3: confirmation -->
  <rect x="30" y="360" width="800" height="60" rx="10" fill="#16263f" stroke="#4bd18a" stroke-width="1"/>
  <text x="52" y="386" fill="#4bd18a" font-size="13.5" font-weight="700">✓ Denial recorded — audit event #1842</text>
  <text x="52" y="406" fill="#8fa3bf" font-size="12">Requester and all operators notified with your reason · leaf counter unchanged: 184,204 / 1,048,576 · View audit entry</text>
  <!-- step 4: queue row after -->
  <rect x="30" y="436" width="800" height="60" rx="10" fill="#16263f"/>
  <circle cx="58" cy="466" r="9" fill="#e05555"/>
  <text x="82" y="460" fill="#e8eef7" font-size="14" font-weight="600">#42 · 500,000.00 USDC → 0x7bE1…9A04</text>
  <text x="82" y="482" fill="#e05555" font-size="12">🔴 Denied by Administrator — "Recipient unreachable on the verified phone number…" · re-queue only as a new Safe transaction</text>
  <text x="30" y="512" fill="#5b7292" font-size="11.5">Denials cost no XMSS leaf and are as visible as approvals — a veto nobody sees just teaches people to route around you.</text>
</svg>
