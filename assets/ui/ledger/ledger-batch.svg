<svg xmlns="http://www.w3.org/2000/svg" width="1065" height="400" viewBox="0 0 1065 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1065" height="400" fill="#0c1626"/>
  <text x="30" y="44" fill="#e8eef7" font-size="18" font-weight="700">Batch approval — one payload, one signature, one confirmation</text>
  <g>
    <rect x="30" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#22354f" stroke-width="2"/>
    <rect x="48" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="60" y="122" fill="#57d6c0" font-size="11" font-weight="700">REVIEW APPROVAL</text>
    <text x="60" y="150" fill="#e8eef7" font-size="11.5" font-weight="700">Batch payload</text>
    <text x="60" y="183.333" fill="#8fa3bf" font-size="9.5">MultiSendCallOnly is</text>
    <text x="60" y="200" fill="#8fa3bf" font-size="9.5">one payload: there is</text>
    <text x="60" y="216.667" fill="#8fa3bf" font-size="9.5">no "sign N pending"</text>
    <text x="60" y="233.333" fill="#8fa3bf" font-size="9.5">mode in the firmware</text>
    <text x="60" y="262" fill="#5b7292" font-size="9.5">Intent page</text>
    <circle cx="122" cy="312" r="12" fill="#22354f"/>
  </g>
  <g>
    <rect x="235" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#22354f" stroke-width="2"/>
    <rect x="253" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="265" y="122" fill="#57d6c0" font-size="11" font-weight="700">LEGS</text>
    <text x="265" y="150" fill="#e8eef7" font-size="15" font-weight="700">4</text>
    <text x="265" y="183.333" fill="#8fa3bf" font-size="9.5">leg-by-leg review</text>
    <text x="265" y="200" fill="#8fa3bf" font-size="9.5">happens in the add-on</text>
    <text x="265" y="216.667" fill="#8fa3bf" font-size="9.5">UI; the Guard</text>
    <text x="265" y="233.333" fill="#8fa3bf" font-size="9.5">re-validates each one</text>
    <text x="265" y="262" fill="#5b7292" font-size="9.5">Field · Legs</text>
    <circle cx="327" cy="312" r="12" fill="#22354f"/>
  </g>
  <g>
    <rect x="440" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#22354f" stroke-width="2"/>
    <rect x="458" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="470" y="122" fill="#e0a955" font-size="11" font-weight="700">TOTALS</text>
    <text x="470" y="150" fill="#e8eef7" font-size="10.5">750,000.00 USDC</text>
    <text x="470" y="166.667" fill="#e8eef7" font-size="10.5">12.5 WETH</text>
    <text x="470" y="200" fill="#8fa3bf" font-size="9.5">host-supplied and</text>
    <text x="470" y="216.667" fill="#8fa3bf" font-size="9.5">informational — not</text>
    <text x="470" y="233.333" fill="#8fa3bf" font-size="9.5">part of the signature</text>
    <text x="470" y="262" fill="#5b7292" font-size="9.5">Field · totals</text>
    <circle cx="532" cy="312" r="12" fill="#22354f"/>
  </g>
  <g>
    <rect x="645" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#22354f" stroke-width="2"/>
    <rect x="663" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="675" y="122" fill="#57d6c0" font-size="11" font-weight="700">DATA HASH</text>
    <text x="675" y="150" fill="#e8eef7" font-size="9.5">0x4c9a17e3b8d240</text>
    <text x="675" y="166.667" fill="#e8eef7" font-size="9.5">15ff62c7a90e3b44</text>
    <text x="675" y="183.333" fill="#e8eef7" font-size="9.5">81d05e7c2fa6193d</text>
    <text x="675" y="216.667" fill="#8fa3bf" font-size="9.5">full 32 bytes: this is</text>
    <text x="675" y="233.333" fill="#8fa3bf" font-size="9.5">what binds the batch</text>
    <text x="675" y="262" fill="#5b7292" font-size="9.5">Field · binding hash</text>
    <circle cx="737" cy="312" r="12" fill="#22354f"/>
  </g>
  <g>
    <rect x="850" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#22354f" stroke-width="2"/>
    <rect x="868" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="880" y="122" fill="#57d6c0" font-size="11" font-weight="700">SIGN APPROVAL?</text>
    <text x="880" y="150" fill="#e8eef7" font-size="11.5" font-weight="700">Hold to sign</text>
    <text x="880" y="167" fill="#8fa3bf" font-size="11.5">Reject</text>
    <text x="880" y="201" fill="#8fa3bf" font-size="9.5">one leaf for the</text>
    <text x="880" y="218" fill="#8fa3bf" font-size="9.5">whole batch</text>
    <text x="880" y="262" fill="#5b7292" font-size="9.5">Confirmation page</text>
    <circle cx="942" cy="312" r="12" fill="#57d6c0"/>
  </g>
  <text x="30" y="362" fill="#5b7292" font-size="11.5">The totals are a courtesy; the data hash is the binding. Verify it against the hash the add-on UI shows before holding to sign.</text>
</svg>
