<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="860" height="400" fill="#0c1626"/>
  <text x="30" y="44" fill="#e8eef7" font-size="18" font-weight="700">Signing flow — screens 1–4 of 8 (TRANSFER class)</text>
  <!-- screen 1: header -->
  <g>
    <rect x="30" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#22354f" stroke-width="2"/>
    <rect x="48" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="60" y="122" fill="#57d6c0" font-size="11" font-weight="700">SIGN APPROVAL</text>
    <text x="60" y="150" fill="#e8eef7" font-size="12">Leaf #184,204</text>
    <text x="60" y="168" fill="#8fa3bf" font-size="10.5">of 1,048,576</text>
    <text x="60" y="200" fill="#8fa3bf" font-size="10.5">Transfer class</text>
    <text x="60" y="262" fill="#5b7292" font-size="9.5">Screen 1 · header</text>
    <circle cx="122" cy="312" r="12" fill="#22354f"/>
  </g>
  <!-- screen 2: token -->
  <g>
    <rect x="235" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#22354f" stroke-width="2"/>
    <rect x="253" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="265" y="122" fill="#57d6c0" font-size="11" font-weight="700">TOKEN</text>
    <text x="265" y="152" fill="#e8eef7" font-size="13" font-weight="700">USDC</text>
    <text x="265" y="178" fill="#8fa3bf" font-size="10">0xA0b8 6991 c621</text>
    <text x="265" y="192" fill="#8fa3bf" font-size="10">8b36 c1d1 9D4a</text>
    <text x="265" y="206" fill="#8fa3bf" font-size="10">2e9E b0cE 3606 eB48</text>
    <text x="265" y="232" fill="#5b7292" font-size="9.5">unrecognized contract ⇒</text>
    <text x="265" y="245" fill="#5b7292" font-size="9.5">"Unknown token" + full addr</text>
    <text x="265" y="262" fill="#5b7292" font-size="9.5">Screen 2 · token</text>
    <circle cx="327" cy="312" r="12" fill="#22354f"/>
  </g>
  <!-- screen 3: amount -->
  <g>
    <rect x="440" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#22354f" stroke-width="2"/>
    <rect x="458" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="470" y="122" fill="#57d6c0" font-size="11" font-weight="700">AMOUNT</text>
    <text x="470" y="152" fill="#e8eef7" font-size="13" font-weight="700">500,000.00</text>
    <text x="470" y="170" fill="#e8eef7" font-size="13" font-weight="700">USDC</text>
    <text x="470" y="200" fill="#8fa3bf" font-size="9.5">raw: 500000000000</text>
    <text x="470" y="262" fill="#5b7292" font-size="9.5">Screen 3 · amount</text>
    <circle cx="532" cy="312" r="12" fill="#22354f"/>
  </g>
  <!-- screen 4: recipient -->
  <g>
    <rect x="645" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#22354f" stroke-width="2"/>
    <rect x="663" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="675" y="122" fill="#57d6c0" font-size="11" font-weight="700">RECIPIENT 1/3</text>
    <text x="675" y="150" fill="#e8eef7" font-size="11.5">0x7bE1 4C09</text>
    <text x="675" y="168" fill="#e8eef7" font-size="11.5">aa31 08D2</text>
    <text x="675" y="186" fill="#e8eef7" font-size="11.5">55f1 9E77 …</text>
    <text x="675" y="214" fill="#8fa3bf" font-size="9.5">full address, never</text>
    <text x="675" y="228" fill="#8fa3bf" font-size="9.5">truncated</text>
    <text x="675" y="262" fill="#5b7292" font-size="9.5">Screen 4 · recipient</text>
    <circle cx="737" cy="312" r="12" fill="#22354f"/>
  </g>
  <text x="30" y="374" fill="#5b7292" font-size="11.5">Every field screen must be traversed before the decision screen — the firmware has no skip path and no raw-hash blind-signing mode.</text>
</svg>
