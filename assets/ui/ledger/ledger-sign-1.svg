<svg xmlns="http://www.w3.org/2000/svg" width="1065" height="400" viewBox="0 0 1065 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1065" height="400" fill="#0c1626"/>
  <text x="30" y="44" fill="#e8eef7" font-size="18" font-weight="700">Sign approval — intent and the first field pages (TRANSFER class)</text>
  <g>
    <rect x="30" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#22354f" stroke-width="2"/>
    <rect x="48" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="60" y="122" fill="#57d6c0" font-size="11" font-weight="700">REVIEW APPROVAL</text>
    <text x="60" y="150" fill="#e8eef7" font-size="11.5" font-weight="700">FermionGuard</text>
    <text x="60" y="167" fill="#e8eef7" font-size="11.5" font-weight="700">pre-approval</text>
    <text x="60" y="201" fill="#8fa3bf" font-size="10">Key 2 · orbit velvet</text>
    <text x="60" y="218" fill="#8fa3bf" font-size="10">Leaf 184,204</text>
    <text x="60" y="262" fill="#5b7292" font-size="9.5">Intent page</text>
    <circle cx="122" cy="312" r="12" fill="#22354f"/>
  </g>
  <g>
    <rect x="235" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#22354f" stroke-width="2"/>
    <rect x="253" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="265" y="122" fill="#57d6c0" font-size="11" font-weight="700">AMOUNT</text>
    <text x="265" y="150" fill="#e8eef7" font-size="13" font-weight="700">500,000.00</text>
    <text x="265" y="166.667" fill="#e8eef7" font-size="13" font-weight="700">USDC</text>
    <text x="265" y="200" fill="#8fa3bf" font-size="9.5">ticker from the CAL</text>
    <text x="265" y="216.667" fill="#8fa3bf" font-size="9.5">descriptor the host</text>
    <text x="265" y="233.333" fill="#8fa3bf" font-size="9.5">provided</text>
    <text x="265" y="262" fill="#5b7292" font-size="9.5">Field 1 · Amount</text>
    <circle cx="327" cy="312" r="12" fill="#22354f"/>
  </g>
  <g>
    <rect x="440" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#22354f" stroke-width="2"/>
    <rect x="458" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="470" y="122" fill="#e0a955" font-size="11" font-weight="700">TOKEN</text>
    <text x="470" y="150" fill="#e8eef7" font-size="11.5" font-weight="700">Unknown token</text>
    <text x="470" y="162.5" fill="#e8eef7" font-size="10">0xA0b86991c6218b</text>
    <text x="470" y="175" fill="#e8eef7" font-size="10">36c1d19D4a2e9Eb0</text>
    <text x="470" y="187.5" fill="#e8eef7" font-size="10">cE3606eB48</text>
    <text x="470" y="212.5" fill="#8fa3bf" font-size="9.5">no descriptor: full</text>
    <text x="470" y="225" fill="#8fa3bf" font-size="9.5">EIP-55 address, and</text>
    <text x="470" y="237.5" fill="#8fa3bf" font-size="9.5">nothing goes blind</text>
    <text x="470" y="262" fill="#5b7292" font-size="9.5">Field 2 · only if unnamed</text>
    <circle cx="532" cy="312" r="12" fill="#22354f"/>
  </g>
  <g>
    <rect x="645" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#22354f" stroke-width="2"/>
    <rect x="663" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="675" y="122" fill="#57d6c0" font-size="11" font-weight="700">TO</text>
    <text x="675" y="150" fill="#e8eef7" font-size="10.5">0x7bE14C09aa3108</text>
    <text x="675" y="164.286" fill="#e8eef7" font-size="10.5">D255f19E7742Bc91</text>
    <text x="675" y="178.571" fill="#e8eef7" font-size="10.5">0B7C3dF1</text>
    <text x="675" y="207.143" fill="#8fa3bf" font-size="9.5">EIP-55 checksummed,</text>
    <text x="675" y="221.429" fill="#8fa3bf" font-size="9.5">in full, never</text>
    <text x="675" y="235.714" fill="#8fa3bf" font-size="9.5">truncated</text>
    <text x="675" y="262" fill="#5b7292" font-size="9.5">Field 3 · To</text>
    <circle cx="737" cy="312" r="12" fill="#22354f"/>
  </g>
  <g>
    <rect x="850" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#22354f" stroke-width="2"/>
    <rect x="868" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="880" y="122" fill="#57d6c0" font-size="11" font-weight="700">NETWORK</text>
    <text x="880" y="150" fill="#e8eef7" font-size="13" font-weight="700">Ethereum</text>
    <text x="880" y="183.333" fill="#8fa3bf" font-size="9.5">known chain ⇒ name;</text>
    <text x="880" y="200" fill="#8fa3bf" font-size="9.5">unknown ⇒ the decimal</text>
    <text x="880" y="216.667" fill="#8fa3bf" font-size="9.5">chain id, as the</text>
    <text x="880" y="233.333" fill="#8fa3bf" font-size="9.5">Ethereum app does</text>
    <text x="880" y="262" fill="#5b7292" font-size="9.5">Field 4 · Network</text>
    <circle cx="942" cy="312" r="12" fill="#22354f"/>
  </g>
  <text x="30" y="362" fill="#5b7292" font-size="11.5">Amount, To and Network are the Ethereum app's own labels, in its own order. Reject is the footer of every page and is confirmed before it takes effect.</text>
  <text x="30" y="378" fill="#5b7292" font-size="11.5">Colour is a reading aid for this document: NBGL offers black, dark grey, light grey and white, and the Nano screens collapse the first three.</text>
</svg>
