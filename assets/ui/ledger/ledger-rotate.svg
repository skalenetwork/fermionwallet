<svg xmlns="http://www.w3.org/2000/svg" width="1065" height="400" viewBox="0 0 1065 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1065" height="400" fill="#0c1626"/>
  <text x="30" y="44" fill="#e8eef7" font-size="18" font-weight="700">Rotate quantum key — signed with the old key, as a possession proof</text>
  <g>
    <rect x="30" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#e0a955" stroke-width="2"/>
    <rect x="48" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="60" y="122" fill="#e0a955" font-size="11" font-weight="700">⚠ KEY ROTATION</text>
    <text x="60" y="150" fill="#e8eef7" font-size="10.5" font-weight="700">You are replacing</text>
    <text x="60" y="164.286" fill="#e8eef7" font-size="10.5" font-weight="700">this Safe's</text>
    <text x="60" y="178.571" fill="#e8eef7" font-size="10.5" font-weight="700">quantum key</text>
    <text x="60" y="207.143" fill="#8fa3bf" font-size="9.5">SDK warning page, so</text>
    <text x="60" y="221.429" fill="#8fa3bf" font-size="9.5">the warning icon sits</text>
    <text x="60" y="235.714" fill="#8fa3bf" font-size="9.5">on the pages after it</text>
    <text x="60" y="262" fill="#5b7292" font-size="9.5">Warning page</text>
    <circle cx="122" cy="312" r="12" fill="#22354f"/>
  </g>
  <g>
    <rect x="235" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#e0a955" stroke-width="2"/>
    <rect x="253" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="265" y="122" fill="#e0a955" font-size="11" font-weight="700">NEW ADMIN</text>
    <text x="265" y="150" fill="#e8eef7" font-size="10">0x7bE14C09aa3108</text>
    <text x="265" y="164.286" fill="#e8eef7" font-size="10">D255f19E7742Bc91</text>
    <text x="265" y="178.571" fill="#e8eef7" font-size="10">0B7C3dF1</text>
    <text x="265" y="207.143" fill="#8fa3bf" font-size="9.5">unchanged here. A</text>
    <text x="265" y="221.429" fill="#8fa3bf" font-size="9.5">different address gets</text>
    <text x="265" y="235.714" fill="#8fa3bf" font-size="9.5">its own warning page.</text>
    <text x="265" y="262" fill="#5b7292" font-size="9.5">Field · New administrator</text>
    <circle cx="327" cy="312" r="12" fill="#22354f"/>
  </g>
  <g>
    <rect x="440" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#e0a955" stroke-width="2"/>
    <rect x="458" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="470" y="122" fill="#e0a955" font-size="11" font-weight="700">NEW KEY</text>
    <text x="470" y="150" fill="#e8eef7" font-size="10" font-weight="700">Key 3 on this device</text>
    <text x="470" y="166.667" fill="#e8eef7" font-size="10">beacon lumen tide</text>
    <text x="470" y="183.333" fill="#e8eef7" font-size="10">rune saffron cobalt</text>
    <text x="470" y="216.667" fill="#8fa3bf" font-size="9.5">h = 20 · 1,048,576</text>
    <text x="470" y="233.333" fill="#8fa3bf" font-size="9.5">XMSS-SHA2_20_256</text>
    <text x="470" y="262" fill="#5b7292" font-size="9.5">Field · New key</text>
    <circle cx="532" cy="312" r="12" fill="#22354f"/>
  </g>
  <g>
    <rect x="645" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#e0a955" stroke-width="2"/>
    <rect x="663" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="675" y="122" fill="#e0a955" font-size="11" font-weight="700">OLD KEY</text>
    <text x="675" y="150" fill="#e8eef7" font-size="10">orbit velvet cadence</text>
    <text x="675" y="175" fill="#e8eef7" font-size="11" font-weight="700">Abandoning</text>
    <text x="675" y="187.5" fill="#e8eef7" font-size="11" font-weight="700">61,204 unused</text>
    <text x="675" y="200" fill="#e8eef7" font-size="11" font-weight="700">approvals</text>
    <text x="675" y="225" fill="#8fa3bf" font-size="9.5">so a pointless rotation</text>
    <text x="675" y="237.5" fill="#8fa3bf" font-size="9.5">cannot be invisible</text>
    <text x="675" y="262" fill="#5b7292" font-size="9.5">Field · Old key</text>
    <circle cx="737" cy="312" r="12" fill="#22354f"/>
  </g>
  <g>
    <rect x="850" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#e0a955" stroke-width="2"/>
    <rect x="868" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="880" y="122" fill="#e0a955" font-size="11" font-weight="700">SIGN KEY</text>
    <text x="880" y="150" fill="#e0a955" font-size="11" font-weight="700">ROTATION?</text>
    <text x="880" y="164.286" fill="#e8eef7" font-size="11.5" font-weight="700">Hold to sign</text>
    <text x="880" y="178.571" fill="#8fa3bf" font-size="11.5">Reject</text>
    <text x="880" y="207.143" fill="#8fa3bf" font-size="9.5">costs one old-key leaf</text>
    <text x="880" y="221.429" fill="#8fa3bf" font-size="9.5">— the Leaf field says</text>
    <text x="880" y="235.714" fill="#8fa3bf" font-size="9.5">so on the page before</text>
    <text x="880" y="262" fill="#5b7292" font-size="9.5">Confirmation page</text>
    <circle cx="942" cy="312" r="12" fill="#e0a955"/>
  </g>
  <text x="30" y="362" fill="#5b7292" font-size="11.5">Safe, Network, Registry nonce and Valid until are further field pages. The device hashes the fields it displays; it never signs a host-supplied digest.</text>
</svg>
