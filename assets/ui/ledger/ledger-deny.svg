<svg xmlns="http://www.w3.org/2000/svg" width="1065" height="400" viewBox="0 0 1065 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1065" height="400" fill="#0c1626"/>
  <text x="30" y="44" fill="#e8eef7" font-size="18" font-weight="700">Deny approval — a signed refusal that costs no leaf</text>
  <g>
    <rect x="30" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#e05555" stroke-width="2"/>
    <rect x="48" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="60" y="122" fill="#e05555" font-size="11" font-weight="700">REVIEW DENIAL</text>
    <text x="60" y="150" fill="#e8eef7" font-size="11.5" font-weight="700">Refuse this</text>
    <text x="60" y="166.667" fill="#e8eef7" font-size="11.5" font-weight="700">pre-approval</text>
    <text x="60" y="200" fill="#8fa3bf" font-size="9.5">the title, not a frame</text>
    <text x="60" y="216.667" fill="#8fa3bf" font-size="9.5">colour, is what tells a</text>
    <text x="60" y="233.333" fill="#8fa3bf" font-size="9.5">denial from a signature</text>
    <text x="60" y="262" fill="#5b7292" font-size="9.5">Intent page</text>
    <circle cx="122" cy="312" r="12" fill="#22354f"/>
  </g>
  <g>
    <rect x="235" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#e05555" stroke-width="2"/>
    <rect x="253" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="265" y="122" fill="#e05555" font-size="11" font-weight="700">PAYLOAD HASH</text>
    <text x="265" y="150" fill="#e8eef7" font-size="9.5">0x88ab40aa5e1f2b</text>
    <text x="265" y="166.667" fill="#e8eef7" font-size="9.5">7c93d8114e8b6620</text>
    <text x="265" y="183.333" fill="#e8eef7" font-size="9.5">fd5177c9e4a30b22</text>
    <text x="265" y="216.667" fill="#8fa3bf" font-size="9.5">the approval being</text>
    <text x="265" y="233.333" fill="#8fa3bf" font-size="9.5">refused, in full</text>
    <text x="265" y="262" fill="#5b7292" font-size="9.5">Field · what is refused</text>
    <circle cx="327" cy="312" r="12" fill="#22354f"/>
  </g>
  <g>
    <rect x="440" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#e05555" stroke-width="2"/>
    <rect x="458" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="470" y="122" fill="#e05555" font-size="11" font-weight="700">REASON</text>
    <text x="470" y="150" fill="#e8eef7" font-size="10.5">Recipient not on</text>
    <text x="470" y="164.286" fill="#e8eef7" font-size="10.5">the treasury</text>
    <text x="470" y="178.571" fill="#e8eef7" font-size="10.5">allow-list</text>
    <text x="470" y="207.143" fill="#8fa3bf" font-size="9.5">entered in the app; its</text>
    <text x="470" y="221.429" fill="#8fa3bf" font-size="9.5">hash is part of the</text>
    <text x="470" y="235.714" fill="#8fa3bf" font-size="9.5">signed record</text>
    <text x="470" y="262" fill="#5b7292" font-size="9.5">Field · Reason</text>
    <circle cx="532" cy="312" r="12" fill="#22354f"/>
  </g>
  <g>
    <rect x="645" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#e05555" stroke-width="2"/>
    <rect x="663" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="675" y="122" fill="#e05555" font-size="11" font-weight="700">LEAF</text>
    <text x="675" y="150" fill="#e8eef7" font-size="11.5" font-weight="700">None consumed</text>
    <text x="675" y="183.333" fill="#8fa3bf" font-size="9.5">the XMSS counter never</text>
    <text x="675" y="200" fill="#8fa3bf" font-size="9.5">moves: a denial is</text>
    <text x="675" y="216.667" fill="#8fa3bf" font-size="9.5">plain ECDSA over the</text>
    <text x="675" y="233.333" fill="#8fa3bf" font-size="9.5">denial record</text>
    <text x="675" y="262" fill="#5b7292" font-size="9.5">Field · Leaf</text>
    <circle cx="737" cy="312" r="12" fill="#22354f"/>
  </g>
  <g>
    <rect x="850" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#e05555" stroke-width="2"/>
    <rect x="868" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="880" y="122" fill="#e05555" font-size="11" font-weight="700">SIGN DENIAL?</text>
    <text x="880" y="150" fill="#e8eef7" font-size="11.5" font-weight="700">Hold to sign</text>
    <text x="880" y="166.667" fill="#8fa3bf" font-size="11.5">Reject</text>
    <text x="880" y="200" fill="#8fa3bf" font-size="9.5">as auditable as an</text>
    <text x="880" y="216.667" fill="#8fa3bf" font-size="9.5">approval, and as</text>
    <text x="880" y="233.333" fill="#8fa3bf" font-size="9.5">cheap as a no-op</text>
    <text x="880" y="262" fill="#5b7292" font-size="9.5">Confirmation page</text>
    <circle cx="942" cy="312" r="12" fill="#e05555"/>
  </g>
  <text x="30" y="362" fill="#5b7292" font-size="11.5">Red here is a reading aid for this document. On the device the denial is identified by its intent title, its confirmation title and the Leaf field.</text>
</svg>
