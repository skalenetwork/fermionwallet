<svg xmlns="http://www.w3.org/2000/svg" width="1065" height="400" viewBox="0 0 1065 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1065" height="400" fill="#0c1626"/>
  <text x="30" y="44" fill="#e8eef7" font-size="18" font-weight="700">Home, settings and the screens an error is allowed to draw</text>
  <g>
    <rect x="30" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#22354f" stroke-width="2"/>
    <rect x="48" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="60" y="122" fill="#57d6c0" font-size="11" font-weight="700">FERMIONGUARD</text>
    <text x="60" y="162.5" fill="#e8eef7" font-size="10">Hybrid ECDSA + XMSS</text>
    <text x="60" y="175" fill="#e8eef7" font-size="10">pre-approvals for</text>
    <text x="60" y="187.5" fill="#e8eef7" font-size="10">Gnosis Safe</text>
    <text x="60" y="212.5" fill="#8fa3bf" font-size="9.5">icon, name and one</text>
    <text x="60" y="225" fill="#8fa3bf" font-size="9.5">description line —</text>
    <text x="60" y="237.5" fill="#8fa3bf" font-size="9.5">nothing else</text>
    <text x="60" y="262" fill="#5b7292" font-size="9.5">Home · idle</text>
    <circle cx="122" cy="312" r="12" fill="#22354f"/>
  </g>
  <g>
    <rect x="235" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#22354f" stroke-width="2"/>
    <rect x="253" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="265" y="122" fill="#57d6c0" font-size="11" font-weight="700">SETTINGS · KEYS</text>
    <text x="265" y="150" fill="#e8eef7" font-size="10">Key 1 · orbit velvet</text>
    <text x="265" y="162.5" fill="#8fa3bf" font-size="10">184,203 / 1,048,576</text>
    <text x="265" y="175" fill="#8fa3bf" font-size="9.5">17% · healthy</text>
    <text x="265" y="200" fill="#8fa3bf" font-size="10">Key 2 · Free</text>
    <text x="265" y="225" fill="#8fa3bf" font-size="9.5">the page to photograph</text>
    <text x="265" y="237.5" fill="#8fa3bf" font-size="9.5">for an audit</text>
    <text x="265" y="262" fill="#5b7292" font-size="9.5">Settings, before Info</text>
    <circle cx="327" cy="312" r="12" fill="#22354f"/>
  </g>
  <g>
    <rect x="440" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#e0a955" stroke-width="2"/>
    <rect x="458" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="470" y="122" fill="#e0a955" font-size="11" font-weight="700">⚠ ROTATION</text>
    <text x="470" y="150" fill="#e0a955" font-size="11" font-weight="700">OVERDUE</text>
    <text x="470" y="162.5" fill="#e8eef7" font-size="10.5">996,148 / 1,048,576</text>
    <text x="470" y="175" fill="#e8eef7" font-size="10">95% of leaves used.</text>
    <text x="470" y="187.5" fill="#e8eef7" font-size="10">Rotate this key now.</text>
    <text x="470" y="212.5" fill="#8fa3bf" font-size="9.5">prepended to every</text>
    <text x="470" y="225" fill="#8fa3bf" font-size="9.5">signing flow past the</text>
    <text x="470" y="237.5" fill="#8fa3bf" font-size="9.5">warning threshold</text>
    <text x="470" y="262" fill="#5b7292" font-size="9.5">SDK warning page</text>
    <circle cx="532" cy="312" r="12" fill="#22354f"/>
  </g>
  <g>
    <rect x="645" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#e05555" stroke-width="2"/>
    <rect x="663" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="675" y="122" fill="#e05555" font-size="11" font-weight="700">KEY EXHAUSTED</text>
    <text x="675" y="150" fill="#e8eef7" font-size="10.5">All 1,048,576</text>
    <text x="675" y="162.5" fill="#e8eef7" font-size="10.5">leaves consumed.</text>
    <text x="675" y="187.5" fill="#e8eef7" font-size="10">This key can no</text>
    <text x="675" y="200" fill="#e8eef7" font-size="10">longer sign. Rotate</text>
    <text x="675" y="212.5" fill="#e8eef7" font-size="10">to a new key.</text>
    <text x="675" y="237.5" fill="#8fa3bf" font-size="9.5">hard refusal · 0x6983</text>
    <text x="675" y="262" fill="#5b7292" font-size="9.5">Screen + status word</text>
    <circle cx="737" cy="312" r="12" fill="#22354f"/>
  </g>
  <g>
    <rect x="850" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#e05555" stroke-width="2"/>
    <rect x="868" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="880" y="122" fill="#e05555" font-size="11" font-weight="700">CANNOT BE</text>
    <text x="880" y="150" fill="#e05555" font-size="11" font-weight="700">CLEAR-SIGNED</text>
    <text x="880" y="162.5" fill="#e8eef7" font-size="10">FermionGuard never</text>
    <text x="880" y="175" fill="#e8eef7" font-size="10">signs a payload it</text>
    <text x="880" y="187.5" fill="#e8eef7" font-size="10">cannot display.</text>
    <text x="880" y="212.5" fill="#e8eef7" font-size="11" font-weight="700">Reject</text>
    <text x="880" y="225" fill="#8fa3bf" font-size="9.5">no setting to enable —</text>
    <text x="880" y="237.5" fill="#8fa3bf" font-size="9.5">this is the only action</text>
    <text x="880" y="262" fill="#5b7292" font-size="9.5">Clear-signing refusal</text>
    <circle cx="942" cy="312" r="12" fill="#e05555"/>
  </g>
  <text x="30" y="362" fill="#5b7292" font-size="11.5">Every other failure is a status word and no screen, as in the Ethereum app: the host holds the code and is the right place to explain it.</text>
  <text x="30" y="378" fill="#5b7292" font-size="11.5">A screen is drawn only where the Administrator has to act on the device.</text>
</svg>
