<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="860" height="400" fill="#0c1626"/>
  <text x="30" y="44" fill="#e8eef7" font-size="18" font-weight="700">Signing flow — screens 5–8 of 8 (TRANSFER class)</text>
  <!-- screen 5: validity -->
  <g>
    <rect x="30" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#22354f" stroke-width="2"/>
    <rect x="48" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="60" y="122" fill="#57d6c0" font-size="11" font-weight="700">VALIDITY</text>
    <text x="60" y="150" fill="#e8eef7" font-size="11.5">21 Sep 15:40 UTC</text>
    <text x="60" y="168" fill="#8fa3bf" font-size="11">→</text>
    <text x="60" y="186" fill="#e8eef7" font-size="11.5">21 Sep 21:40 UTC</text>
    <text x="60" y="216" fill="#8fa3bf" font-size="9.5">absolute times only —</text>
    <text x="60" y="230" fill="#8fa3bf" font-size="9.5">durations hide clock skew</text>
    <text x="60" y="262" fill="#5b7292" font-size="9.5">Screen 5 · validity</text>
    <circle cx="122" cy="312" r="12" fill="#22354f"/>
  </g>
  <!-- screen 6: context -->
  <g>
    <rect x="235" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#22354f" stroke-width="2"/>
    <rect x="253" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="265" y="122" fill="#57d6c0" font-size="11" font-weight="700">CONTEXT 1/2</text>
    <text x="265" y="150" fill="#8fa3bf" font-size="10">Safe</text>
    <text x="265" y="166" fill="#e8eef7" font-size="10.5">0x9aF3 07bD 4410</text>
    <text x="265" y="180" fill="#e8eef7" font-size="10.5">e2C0 88a1 … C21e</text>
    <text x="265" y="206" fill="#e8eef7" font-size="11">Ethereum · chain 1</text>
    <text x="265" y="224" fill="#e8eef7" font-size="11">Safe nonce 42</text>
    <text x="265" y="262" fill="#5b7292" font-size="9.5">Screen 6 · context</text>
    <circle cx="327" cy="312" r="12" fill="#22354f"/>
  </g>
  <!-- screen 7: policy hash -->
  <g>
    <rect x="440" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#22354f" stroke-width="2"/>
    <rect x="458" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="470" y="122" fill="#57d6c0" font-size="11" font-weight="700">POLICY</text>
    <text x="470" y="152" fill="#e8eef7" font-size="11.5">0x7c31 f2aa</text>
    <text x="470" y="170" fill="#8fa3bf" font-size="11">…</text>
    <text x="470" y="188" fill="#e8eef7" font-size="11.5">90d1 14e8</text>
    <text x="470" y="216" fill="#8fa3bf" font-size="9.5">compare against the</text>
    <text x="470" y="230" fill="#8fa3bf" font-size="9.5">hash in the host UI</text>
    <text x="470" y="262" fill="#5b7292" font-size="9.5">Screen 7 · policy hash</text>
    <circle cx="532" cy="312" r="12" fill="#22354f"/>
  </g>
  <!-- screen 8: decision -->
  <g>
    <rect x="645" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#22354f" stroke-width="2"/>
    <rect x="663" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="675" y="122" fill="#57d6c0" font-size="11" font-weight="700">APPROVE?</text>
    <text x="675" y="150" fill="#e8eef7" font-size="11.5">Hold to approve</text>
    <text x="675" y="176" fill="#e05555" font-size="11.5">Tap to reject</text>
    <text x="675" y="210" fill="#8fa3bf" font-size="9.5">counter commits</text>
    <text x="675" y="224" fill="#8fa3bf" font-size="9.5">before signature</text>
    <text x="675" y="262" fill="#5b7292" font-size="9.5">Screen 8 · decision</text>
    <circle cx="737" cy="312" r="12" fill="#57d6c0"/>
  </g>
  <text x="30" y="374" fill="#5b7292" font-size="11.5">Reject is a single tap; approval needs the deliberate long-press / both-buttons idiom. 60 s idle on screen 8 = automatic reject, no leaf consumed.</text>
</svg>
