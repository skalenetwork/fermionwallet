<svg xmlns="http://www.w3.org/2000/svg" width="1065" height="400" viewBox="0 0 1065 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1065" height="400" fill="#0c1626"/>
  <text x="30" y="44" fill="#e8eef7" font-size="18" font-weight="700">Sign approval — the FermionGuard field pages and the confirmation</text>
  <g>
    <rect x="30" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#22354f" stroke-width="2"/>
    <rect x="48" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="60" y="122" fill="#57d6c0" font-size="11" font-weight="700">SAFE</text>
    <text x="60" y="150" fill="#e8eef7" font-size="10.5">0x9aF307bD4410e2</text>
    <text x="60" y="166.667" fill="#e8eef7" font-size="10.5">C088a163Ef42cD97</text>
    <text x="60" y="183.333" fill="#e8eef7" font-size="10.5">5B0aC21e</text>
    <text x="60" y="216.667" fill="#8fa3bf" font-size="9.5">the Safe this approval</text>
    <text x="60" y="233.333" fill="#8fa3bf" font-size="9.5">is signed for</text>
    <text x="60" y="262" fill="#5b7292" font-size="9.5">Field 5 · Safe</text>
    <circle cx="122" cy="312" r="12" fill="#22354f"/>
  </g>
  <g>
    <rect x="235" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#22354f" stroke-width="2"/>
    <rect x="253" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="265" y="122" fill="#57d6c0" font-size="11" font-weight="700">VALID UNTIL</text>
    <text x="265" y="150" fill="#e8eef7" font-size="11.5">21 Sep 2026</text>
    <text x="265" y="164.286" fill="#e8eef7" font-size="11.5">21:40 UTC</text>
    <text x="265" y="192.857" fill="#8fa3bf" font-size="9.5">absolute times only —</text>
    <text x="265" y="207.143" fill="#8fa3bf" font-size="9.5">durations hide clock</text>
    <text x="265" y="221.429" fill="#8fa3bf" font-size="9.5">skew. Valid from is</text>
    <text x="265" y="235.714" fill="#8fa3bf" font-size="9.5">the page before.</text>
    <text x="265" y="262" fill="#5b7292" font-size="9.5">Field 6 · validity</text>
    <circle cx="327" cy="312" r="12" fill="#22354f"/>
  </g>
  <g>
    <rect x="440" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#22354f" stroke-width="2"/>
    <rect x="458" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="470" y="122" fill="#57d6c0" font-size="11" font-weight="700">SAFE TX</text>
    <text x="470" y="150" fill="#e8eef7" font-size="9.5">0x5e1f2b7c40aa93</text>
    <text x="470" y="164.286" fill="#e8eef7" font-size="9.5">d8114e8b6620fd51</text>
    <text x="470" y="178.571" fill="#e8eef7" font-size="9.5">77c9e4a30b2288ab</text>
    <text x="470" y="207.143" fill="#8fa3bf" font-size="9.5">full 32 bytes. Zero ⇒</text>
    <text x="470" y="221.429" fill="#8fa3bf" font-size="9.5">a warning page and</text>
    <text x="470" y="235.714" fill="#8fa3bf" font-size="9.5">"Not pinned"</text>
    <text x="470" y="262" fill="#5b7292" font-size="9.5">Field 7 · Safe tx pin</text>
    <circle cx="532" cy="312" r="12" fill="#22354f"/>
  </g>
  <g>
    <rect x="645" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#22354f" stroke-width="2"/>
    <rect x="663" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="675" y="122" fill="#57d6c0" font-size="11" font-weight="700">LEAF</text>
    <text x="675" y="150" fill="#e8eef7" font-size="13" font-weight="700">184,204</text>
    <text x="675" y="166.667" fill="#8fa3bf" font-size="11">of 1,048,576</text>
    <text x="675" y="200" fill="#8fa3bf" font-size="9.5">the odometer. Policy</text>
    <text x="675" y="216.667" fill="#8fa3bf" font-size="9.5">hash and Key are the</text>
    <text x="675" y="233.333" fill="#8fa3bf" font-size="9.5">pages either side.</text>
    <text x="675" y="262" fill="#5b7292" font-size="9.5">Field 10 · Leaf</text>
    <circle cx="737" cy="312" r="12" fill="#22354f"/>
  </g>
  <g>
    <rect x="850" y="70" width="185" height="270" rx="16" fill="#16263f" stroke="#22354f" stroke-width="2"/>
    <rect x="868" y="94" width="149" height="190" rx="6" fill="#060d18"/>
    <text x="880" y="122" fill="#57d6c0" font-size="11" font-weight="700">SIGN APPROVAL?</text>
    <text x="880" y="150" fill="#e8eef7" font-size="11.5" font-weight="700">Hold to sign</text>
    <text x="880" y="166.667" fill="#8fa3bf" font-size="11.5">Reject</text>
    <text x="880" y="200" fill="#8fa3bf" font-size="9.5">counter commits in</text>
    <text x="880" y="216.667" fill="#8fa3bf" font-size="9.5">NVRAM before either</text>
    <text x="880" y="233.333" fill="#8fa3bf" font-size="9.5">half is buffered</text>
    <text x="880" y="262" fill="#5b7292" font-size="9.5">Confirmation page</text>
    <circle cx="942" cy="312" r="12" fill="#57d6c0"/>
  </g>
  <text x="30" y="362" fill="#5b7292" font-size="11.5">On approve the leaf counter commits first, then the host pages the signature out with GET_SIGNATURE_CHUNK: XMSS bytes first, the ECDSA half last.</text>
  <text x="30" y="378" fill="#5b7292" font-size="11.5">Reject, or 60 s idle here, returns 0x6985 and consumes no leaf. Status page afterwards: "Operation signed" or "Operation rejected".</text>
</svg>
