# FermionGuard demo on the real Safe{Wallet}.
#
# The open-source Safe stack (safe-global/safe-infrastructure: Safe{Wallet} web UI,
# Client Gateway, Config Service, Transaction Service) runs against a local anvil
# chain that carries Safe v1.4.1 at its canonical addresses, a demo Safe protected
# by the FermionGuard, and the FermionGuard Safe App with a simulated Ledger.
#
#   docker compose up -d --wait   # about a minute once the images are pulled
#   open http://localhost:8000    # Safe{Wallet}
#   docker compose down -v        # stop and reset everything (chain + databases)
#
# From a source checkout, build the two FermionGuard images instead of pulling:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build --wait
#
# Ports: 8000 Safe{Wallet} + services (RPC at /rpc), 8001 the FermionGuard Safe App.
# Nothing is persisted: the chain and the Safe services' databases live in memory,
# so any restart (or `down -v`) resets the demo to a fresh, consistent state.
name: fermionguard-demo

x-pg: &pg
  image: postgres:14-alpine
  environment:
    POSTGRES_PASSWORD: postgres
  # The chain lives only in anvil's memory, so the indexes must too: after a
  # stop/start or a reboot, every service starts fresh with the fresh chain.
  tmpfs: /var/lib/postgresql/data
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 3s
    timeout: 5s
    retries: 30

x-redis: &redis
  image: redis:7-alpine
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 3s
    timeout: 5s
    retries: 30

x-txs: &txs
  image: ghcr.io/safe-global/safe-transaction-service:${TXS_VERSION:-v6.5.0}
  env_file: env/txs.env
  # `docker compose restart` starts every container at once, ignoring depends_on.
  # With the in-memory databases wiped, a worker can then query tables the indexer
  # has not migrated yet and exit; retry until the migrations are in.
  restart: on-failure
  depends_on:
    txs-db: { condition: service_healthy }
    txs-redis: { condition: service_healthy }
    txs-rabbitmq: { condition: service_healthy }
    chain: { condition: service_healthy }

services:
  # ── FermionGuard: anvil chain + Guard + demo Safe + simulated Ledger + Safe App ──
  chain:
    image: ${FERMION_DEMO_IMAGE:-ghcr.io/skalenetwork/fermionguard-demo:latest}
    environment:
      DEMO_MODE: wallet
      # The Safe App's backend reads each Safe's queue from the Transaction Service.
      TXS_URL: http://nginx:8000/txs
      # Which Ledger signs: "simulator" (default), "speculos" (the real app in
      # Ledger's emulator — bring it up with `--profile ledger`), or "usb".
      LEDGER_TRANSPORT: ${LEDGER_TRANSPORT:-simulator}
      SPECULOS_APDU_URL: tcp://ledger:9999
      SPECULOS_API_URL: http://ledger:5000
    # Forward SIGTERM to every process of the demo (the entrypoint shell, anvil, the
    # server), so a restart stops the old chain at once instead of after 10 s.
    init: true
    ports:
      - "8001:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/state"]
      interval: 3s
      timeout: 5s
      retries: 100

  # ── The FermionGuard Ledger app, in Ledger's emulator ──
  # Off by default: `docker compose --profile ledger up -d` runs the real app, built
  # from ledger-app/, and LEDGER_TRANSPORT=speculos points the demo at it. The seed is
  # anvil's mnemonic, so the device's ECDSA key is the demo's registered
  # Quantum Administrator. Its screens show at http://localhost:5001.
  ledger:
    profiles: ["ledger"]
    image: ghcr.io/ledgerhq/speculos:latest
    # The ELF is a bind mount, and Docker creates an empty DIRECTORY at a bind source
    # that does not exist rather than refusing — so an unbuilt ledger-app/ produces a
    # Speculos that starts, finds no app, and fails in a way that reads like an emulator
    # problem. The entrypoint checks first and says what to run instead.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /app/app.elf ] || [ ! -s /app/app.elf ]; then
          echo "No Ledger app at ledger-app/build/nanos2/bin/app.elf."
          echo "Build it first:  ./ledger-app/build.sh"
          echo "Or point LEDGER_APP_ELF at an existing build."
          exit 1
        fi
        exec speculos --model nanosp --display headless --api-port 5000 --apdu-port 9999 \
          --seed "test test test test test test test test test test test junk" \
          /app/app.elf
    volumes:
      - ${LEDGER_APP_ELF:-../../ledger-app/build/nanos2/bin/app.elf}:/app/app.elf:ro
    ports:
      - "5001:5000"

  # ── Safe{Wallet} (static export) + reverse proxy for all Safe services ──
  nginx:
    image: ${FERMION_WALLET_UI_IMAGE:-ghcr.io/skalenetwork/fermionguard-demo-wallet:latest}
    ports:
      - "8000:8000"
    volumes:
      - nginx-shared-txs:/nginx-txs
      - nginx-shared-cfg:/nginx-cfg
    depends_on:
      txs-web: { condition: service_started }
      cfg-web: { condition: service_started }
      cgw-web: { condition: service_started }
      chain: { condition: service_healthy }
    # Healthy once Safe{Wallet} can actually load the demo Safe: the gateway knows it
    # and its dUSD balance is indexed. Until then Safe{Wallet} shows "This Safe Account
    # couldn't be loaded", so `up --wait` must not return before this passes.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          safe=$$(wget -qO- http://chain:8080/api/state | grep -o '"safe": "0x[0-9a-fA-F]*"' | grep -o '0x[0-9a-fA-F]*')
          && wget -qO- http://127.0.0.1:8000/cgw/v1/chains/31337/safes/$$safe >/dev/null
          && wget -qO- "http://127.0.0.1:8000/cgw/v1/chains/31337/safes/$$safe/balances/usd?trusted=false" | grep -q dUSD
      interval: 3s
      timeout: 10s
      retries: 100

  # ── Safe Transaction Service ──
  txs-db:
    <<: *pg
    command: -c max_connections=250
  txs-redis: *redis
  txs-rabbitmq:
    image: rabbitmq:3-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30

  txs-worker-indexer:
    <<: *txs
    environment:
      RUN_MIGRATIONS: 1  # migrate + setup_service (finds Safe 1.4.1 on the chain)
      WORKER_QUEUES: default,indexing,processing
    # setup_service registers the Safe singletons only if their code is already on
    # the chain; run too early it registers none and the demo Safe is never indexed.
    # `up` orders this through depends_on, but `docker compose restart` starts every
    # container at once, so first wait for the chain container's API, which answers
    # only once the Safe contracts, the demo Safe and the Guard are deployed.
    command:
      - sh
      - -c
      - |
        python - <<'EOF'
        import time, urllib.request
        for _ in range(300):
            try:
                urllib.request.urlopen("http://chain:8080/api/state", timeout=5)
                break
            except Exception:
                time.sleep(2)
        else:
            raise SystemExit("the chain did not come up")
        print("chain ready", flush=True)
        EOF
        # On `docker compose restart` the old chain can still answer the wait above
        # while it shuts down; setup_service then meets the fresh chain before its Safe
        # contracts exist. So repeat it until it has registered the Safe singletons.
        for i in $$(seq 60); do
          python manage.py migrate --noinput >/dev/null && python manage.py setup_service >/dev/null &&
            python manage.py shell -c "from safe_transaction_service.history.models import SafeMasterCopy as M; raise SystemExit(0 if M.objects.exists() else 1)" >/dev/null &&
            break
          echo "Safe singletons not registered yet, retrying" && sleep 3
        done
        exec docker/web/celery/worker/run.sh
    healthcheck:
      test: ["CMD", "celery", "-A", "config.celery_app", "inspect", "ping"]
      interval: 10s
      timeout: 20s
      retries: 30

  txs-worker-contracts-tokens:
    <<: *txs
    environment:
      WORKER_QUEUES: contracts,tokens
    command: docker/web/celery/worker/run.sh
    depends_on:
      txs-worker-indexer: { condition: service_healthy }

  txs-worker-notifications-webhooks:
    <<: *txs
    environment:
      WORKER_QUEUES: notifications,webhooks
    command: docker/web/celery/worker/run.sh
    depends_on:
      txs-worker-indexer: { condition: service_healthy }

  txs-scheduler:
    <<: *txs
    command: docker/web/celery/scheduler/run.sh
    depends_on:
      txs-worker-indexer: { condition: service_healthy }

  txs-web:
    <<: *txs
    working_dir: /app
    volumes:
      - nginx-shared-txs:/nginx
    command: docker/web/run_web.sh
    depends_on:
      txs-worker-indexer: { condition: service_healthy }

  # ── Safe Config Service (chain 31337 + the FermionGuard Safe App, seeded) ──
  cfg-db: *pg
  cfg-init:
    image: ghcr.io/safe-global/safe-config-service:${CFG_VERSION:-v2.96.1}
    env_file: env/cfg.env
    restart: on-failure  # retry if cfg-db is not up yet (compose restart ignores depends_on)
    volumes:
      - ./bootstrap_cfg.py:/bootstrap_cfg.py:ro
    entrypoint: ["sh", "-c", "python src/manage.py migrate --noinput && python src/manage.py shell < /bootstrap_cfg.py"]
    depends_on:
      cfg-db: { condition: service_healthy }
  cfg-web:
    image: ghcr.io/safe-global/safe-config-service:${CFG_VERSION:-v2.96.1}
    tty: true
    env_file: env/cfg.env
    volumes:
      - nginx-shared-cfg:/nginx
    depends_on:
      cfg-init: { condition: service_completed_successfully }

  # ── Safe Client Gateway ──
  cgw-db: *pg
  cgw-redis: *redis
  cgw-web:
    # v1.115.0 is the newest release published for linux/amd64 (later tags are arm64-only).
    image: ghcr.io/safe-global/safe-client-gateway:${CGW_VERSION:-v1.115.0}
    env_file: env/cgw.env
    restart: on-failure
    depends_on:
      cgw-redis: { condition: service_healthy }
      cgw-db: { condition: service_healthy }

volumes:
  nginx-shared-txs:
  nginx-shared-cfg:
