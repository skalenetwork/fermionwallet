# Reverse proxy for the FermionGuard demo stack — adapted from
# safe-global/safe-infrastructure docker/nginx/nginx.conf.
#   /          Safe{Wallet} static export (built into this image)
#   /cgw/      Safe Client Gateway
#   /cfg/      Safe Config Service
#   /txs/      Safe Transaction Service
#   /rpc       the local anvil chain (the wallet's RPC for chain 31337)
worker_processes 1;

events {
  worker_connections 2000;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 10m;

    # Resolve the containers by name through Docker's DNS on every lookup instead of
    # once at startup: after `docker compose restart` (or a container being recreated)
    # cgw-web and chain come back on new IPs, and a startup-resolved address would
    # leave Safe{Wallet} on 502s until nginx itself is restarted.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream txs_app_server { server unix:/nginx-txs/gunicorn.socket fail_timeout=0; keepalive 32; }
    upstream cfg_app_server { server unix:/nginx-cfg/gunicorn.socket fail_timeout=0; keepalive 32; }
    upstream cgw_app_server { zone cgw 64k; server cgw-web:3000 resolve fail_timeout=0; keepalive 32; }
    upstream chain_rpc { zone chain 64k; server chain:8545 resolve fail_timeout=0; keepalive 8; }

    server {
        access_log off;
        listen 8000;
        charset utf-8;
        keepalive_timeout 75s;

        gzip on;
        gzip_min_length 1000;
        gzip_types text/plain text/css application/json application/javascript text/javascript;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_redirect off;

        location /txs/static { alias /nginx-txs/staticfiles; }
        location /txs/ { proxy_pass http://txs_app_server/; }

        location /cfg/static { alias /nginx-cfg/staticfiles; }
        location /cfg/ {
            proxy_pass http://cfg_app_server/;
            proxy_read_timeout 60s;
        }

        location /cgw/ { proxy_pass http://cgw_app_server/; }

        location = /rpc {
            proxy_pass http://chain_rpc/;
        }

        # Next.js static export: /home -> home.html, /apps/open -> apps/open.html
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri.html $uri/index.html /404.html;
        }
    }
}
