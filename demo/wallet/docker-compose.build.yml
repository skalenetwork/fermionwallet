# Build the FermionGuard images from this source checkout instead of pulling them:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build --wait
services:
  chain:
    image: fermionguard-demo:local
    build:
      context: ../..
      dockerfile: demo/Dockerfile
  nginx:
    image: fermionguard-demo-wallet:local
    build:
      context: ../..
      dockerfile: demo/wallet/ui.Dockerfile
