<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FermionWallet</title>
<link rel="icon" href="/safe-app/logo.svg" type="image/svg+xml">
<style>
  :root {
    --bg:#121312; --panel:#1c1c1c; --panel2:#242424; --text:#f6f7f9; --muted:#a1a3a7; --border:#303033;
    --accent:#12ff80; --accent-soft:#12ff8022; --on-accent:#121312;
    --ok:#4ade80; --bad:#f87171; --warn:#fbbf24; --info:#60a5fa;
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px 16px 40px; background:var(--bg); color:var(--text);
         font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:980px; margin:0 auto; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  header img { height:30px; width:auto; border-radius:6px; }
  header h1 { font-size:20px; margin:0; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px;
          font-size:12px; font-weight:600; white-space:nowrap; }
  .pill.ok { background:rgba(74,222,128,.12); color:var(--ok); }
  .pill.bad { background:rgba(248,113,113,.12); color:var(--bad); }
  .pill.warn { background:rgba(251,191,36,.12); color:var(--warn); }
  .pill.info { background:rgba(96,165,250,.12); color:var(--info); }
  .pill.muted { background:var(--panel2); color:var(--muted); }
  .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  @media (max-width:760px){ .cards{grid-template-columns:1fr;} }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px 16px; min-width:0; }
  .card h2 { font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin:0 0 6px; font-weight:600; }
  .card .big { font-size:18px; font-weight:700; }
  .mono { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12.5px; overflow-wrap:anywhere; }
  .muted { color:var(--muted); }
  .bar { height:6px; border-radius:3px; background:var(--panel2); margin-top:8px; overflow:hidden; }
  .bar > div { height:100%; background:var(--accent); }
  .bar.warn > div { background:var(--warn); } .bar.bad > div { background:var(--bad); }
  nav.tabs { display:flex; gap:4px; margin:20px 0 12px; border-bottom:1px solid var(--border); }
  nav.tabs button { background:none; border:0; color:var(--muted); font:600 14px system-ui,sans-serif;
                    padding:10px 14px; cursor:pointer; border-bottom:2px solid transparent; }
  nav.tabs button[aria-selected="true"] { color:var(--text); border-bottom-color:var(--accent); }
  .count { background:var(--panel2); color:var(--text); border-radius:999px; padding:0 7px; font-size:12px; margin-left:4px; }
  .list { display:flex; flex-direction:column; gap:8px; }
  .row { background:var(--panel); border:1px solid var(--border); border-radius:12px; }
  .row-head { display:grid; grid-template-columns:56px 1fr auto auto; gap:12px; align-items:center; padding:12px 16px; }
  @media (max-width:640px){ .row-head{grid-template-columns:44px 1fr; } .row-head .right{grid-column:2;} }
  .nonce { font-weight:700; color:var(--muted); }
  .title { font-weight:600; }
  .sub { color:var(--muted); font-size:12.5px; overflow-wrap:anywhere; }
  .right { display:flex; gap:8px; align-items:center; justify-content:flex-end; flex-wrap:wrap; }
  button.btn { background:var(--accent); color:var(--on-accent); border:0; border-radius:8px; padding:8px 14px;
               font:600 13.5px system-ui,sans-serif; cursor:pointer; }
  button.btn.ghost { background:transparent; color:var(--text); border:1px solid var(--border); }
  button.btn.danger { background:transparent; color:var(--bad); border:1px solid rgba(248,113,113,.4); }
  button.btn:disabled { opacity:.45; cursor:not-allowed; }
  .review { border-top:1px solid var(--border); padding:14px 16px 16px; }
  dl.fields { display:grid; grid-template-columns:160px 1fr; gap:6px 14px; margin:0 0 12px; }
  @media (max-width:640px){ dl.fields{grid-template-columns:1fr;} }
  dl.fields dt { color:var(--muted); }
  dl.fields dd { margin:0; }
  .check { color:var(--ok); font-size:13px; margin:0 0 12px; }
  .controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  select { background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:13.5px; }
  .msg { margin-top:12px; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); font-size:13px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg.ok { border-color:rgba(74,222,128,.4); color:var(--ok); }
  .msg.bad { border-color:rgba(248,113,113,.4); color:var(--bad); }
  .msg.wait { border-color:rgba(96,165,250,.4); color:var(--info); }
  .empty { text-align:center; padding:36px 16px; color:var(--muted); background:var(--panel); border:1px dashed var(--border); border-radius:12px; }
  table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:top; }
  th { color:var(--muted); font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; }
  tr:last-child td { border-bottom:0; }
  @media (max-width:760px){ .hide-sm{display:none;} }
  .banner { margin-bottom:14px; padding:12px 14px; border-radius:10px; border:1px solid rgba(251,191,36,.4); color:var(--warn); background:rgba(251,191,36,.06); }
  .banner.bad { border-color:rgba(248,113,113,.4); color:var(--bad); background:rgba(248,113,113,.06); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/safe-app/logo.svg" alt="">
    <h1>FermionWallet</h1>
    <span class="pill muted" id="protection">Loading…</span>
  </header>

  <div class="banner" id="banner" hidden></div>

  <section id="main" hidden>
    <div class="cards">
      <div class="card">
        <h2>Protection</h2>
        <div class="big" id="c-protection">—</div>
        <div class="sub mono" id="c-guard"></div>
      </div>
      <div class="card">
        <h2>Quantum key</h2>
        <div class="big" id="c-leaves">—</div>
        <div class="bar" id="c-bar"><div style="width:0"></div></div>
        <div class="sub" id="c-admin"></div>
      </div>
      <div class="card">
        <h2>Safe</h2>
        <div class="big" id="c-safe-nonce">—</div>
        <div class="sub mono" id="c-safe"></div>
      </div>
    </div>

    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-queue" aria-selected="true">Queue<span class="count" id="n-queue">0</span></button>
      <button role="tab" id="tab-approvals" aria-selected="false">Approvals</button>
      <button role="tab" id="tab-key" aria-selected="false">Key</button>
    </nav>

    <div id="view-queue" role="tabpanel">
      <div class="list" id="queue"></div>
    </div>
    <div id="view-approvals" role="tabpanel" hidden>
      <div id="approvals"></div>
    </div>
    <div id="view-key" role="tabpanel" hidden>
      <div class="card"><dl class="fields" id="key"></dl></div>
    </div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const short = a => a ? a.slice(0, 6) + '…' + a.slice(-4) : '—';
const when = ts => new Date(ts * 1000).toLocaleString();

// ── Safe Apps protocol (what @safe-global/safe-apps-sdk sends over postMessage) ──
const SDK_VERSION = '9.1.0';
const pending = new Map();
window.addEventListener('message', ev => {
  if (ev.source !== window.parent || !ev.data || !pending.has(ev.data.id)) return;
  const {resolve, reject} = pending.get(ev.data.id);
  pending.delete(ev.data.id);
  ev.data.success ? resolve(ev.data.data) : reject(new Error(ev.data.error || 'request failed'));
});
function safeCall(method, params = undefined, timeoutMs = 0) {
  const id = Math.random().toString(16).slice(2) + Date.now().toString(16);
  return new Promise((resolve, reject) => {
    pending.set(id, {resolve, reject});
    window.parent.postMessage({id, method, params, env: {sdkVersion: SDK_VERSION}}, '*');
    if (timeoutMs) setTimeout(() => { if (pending.delete(id)) reject(new Error('timeout')); }, timeoutMs);
  });
}
const inSafeWallet = window.parent !== window;

let safe = null;           // address of the Safe this app is opened for
let status = null;         // /status response
let queueData = null;      // /queue response
const reviewOpen = new Set();
const busy = new Map();    // safeTxHash -> {cls, text}
const api = (what, opts) => fetch('/api/v1/safes/' + safe + '/' + what, opts).then(r => r.json());

function banner(text, bad) {
  $('banner').textContent = text;
  $('banner').className = 'banner' + (bad ? ' bad' : '');
  $('banner').hidden = !text;
}

// ── connection to Safe{Wallet} (retried: Safe{Wallet} can be slow to answer) ──
let retry = 1000;
async function connect() {
  if (!inSafeWallet) {
    $('protection').textContent = 'Not in a Safe';
    banner('Open FermionWallet from Safe{Wallet}: Apps → FermionWallet.');
    return;
  }
  try {
    const info = await safeCall('getSafeInfo', undefined, 8000);
    safe = info.safeAddress;
    banner('');
    $('main').hidden = false;
    await refresh();
    setInterval(refresh, 4000);
  } catch (e) {
    banner('Waiting for Safe{Wallet}…');
    setTimeout(connect, retry);
    retry = Math.min(retry * 2, 8000);
  }
}

// ── status cards ──
function renderStatus(s) {
  const p = $('protection');
  if (!s.isContract) {
    p.className = 'pill bad'; p.textContent = 'Not a Safe on this chain';
    banner('No contract at ' + s.safe + ' on chain ' + s.chainId + '.', true);
    return;
  }
  const k = s.key;
  if (s.protected && k && k.status === 'active') {
    p.className = 'pill ok'; p.textContent = 'Protected';
    $('c-protection').textContent = 'Guard active';
    banner('');
  } else if (s.protected) {
    p.className = 'pill warn'; p.textContent = 'No active key';
    $('c-protection').textContent = 'Guard active, no key';
    banner('The FermionWallet Guard is installed but this Safe has no active quantum key, so every transaction is blocked. Register or rotate a key.', true);
  } else {
    p.className = 'pill bad'; p.textContent = 'Not protected';
    $('c-protection').textContent = 'Not protected';
    banner(s.activeGuard
      ? 'This Safe uses a different Guard (' + s.activeGuard + '). FermionWallet approvals have no effect on it.'
      : 'This Safe is not protected by FermionWallet. Its transactions need only owner signatures.', !s.activeGuard);
  }
  $('c-guard').textContent = s.protected ? 'Guard ' + s.guard : (s.activeGuard ? 'Other guard ' + s.activeGuard : 'No guard');
  if (k) {
    const pct = k.leavesUsed / k.leavesTotal;
    $('c-leaves').textContent = k.leavesLeft.toLocaleString() + ' of ' + k.leavesTotal.toLocaleString() + ' signatures left';
    $('c-bar').className = 'bar' + (pct >= .95 ? ' bad' : pct >= .8 ? ' warn' : '');
    $('c-bar').firstElementChild.style.width = (100 * pct).toFixed(1) + '%';
    $('c-admin').innerHTML = 'Administrator <span class="mono">' + esc(short(k.admin)) + '</span> · ' + esc(k.status);
  } else {
    $('c-leaves').textContent = 'No key';
    $('c-admin').textContent = 'No quantum key registered for this Safe';
  }
  $('c-safe-nonce').textContent = 'Nonce ' + s.nonce + ' · ' + s.threshold + ' of owners';
  $('c-safe').textContent = s.safe;
  $('key').innerHTML = k ? [
    ['Status', esc(k.status)],
    ['Administrator (Ledger)', '<span class="mono">' + esc(k.admin) + '</span>'],
    ['Key ID', '<span class="mono">' + esc(k.id) + '</span>'],
    ['XMSS root', '<span class="mono">' + esc(k.root) + '</span>'],
    ['Tree height', esc(k.treeHeight) + ' (' + k.leavesTotal.toLocaleString() + ' one-time signatures)'],
    ['Used / left', k.leavesUsed.toLocaleString() + ' / ' + k.leavesLeft.toLocaleString()],
    ['Registered', esc(when(k.createdAt))],
    ['Guard', '<span class="mono">' + esc(s.guard) + '</span>'],
  ].map(([a, b]) => '<dt>' + a + '</dt><dd>' + b + '</dd>').join('') : '<dt>Key</dt><dd>None registered</dd>';
}

// ── queue ──
const STATUS = {
  needs_approval: ['warn', 'Quantum approval required'],
  approved: ['ok', 'Ready to execute'],
  waiting: ['info', 'Approved · waiting for earlier nonce'],
  unsupported: ['muted', 'Not supported'],
  mismatch: ['bad', 'Hash mismatch — do not sign'],
};
function protectedWithKey() {
  return status && status.protected && status.key && status.key.status === 'active' && status.key.leavesLeft > 0;
}
function renderQueue(q) {
  if (!q) return;
  $('n-queue').textContent = q.transactions.length;
  if (!q.transactions.length) {
    $('queue').innerHTML = '<div class="empty">No pending transactions.<br>Create a transaction in Safe{Wallet} and sign it. ' +
      'It appears here for quantum approval.</div>';
    return;
  }
  const firstNeeding = q.transactions.find(t => t.status === 'needs_approval');
  $('queue').innerHTML = q.transactions.map(t => {
    const [cls, label] = STATUS[t.status] || ['muted', t.status];
    const who = t.kind === 'transfer' ? 'to <span class="mono">' + esc(t.recipient) + '</span>' : '';
    const a = t.approval;
    let actions = '';
    if (t.status === 'needs_approval' && protectedWithKey()) {
      actions = '<button class="btn" data-review="' + t.safeTxHash + '">' + (reviewOpen.has(t.safeTxHash) ? 'Close' : 'Review') + '</button>';
    } else if ((t.status === 'approved' || t.status === 'waiting') && a) {
      actions = '<button class="btn danger" data-revoke="' + a.id + '">Revoke</button>';
    }
    const extra = t.status === 'unsupported' && t.reason ? '<div class="sub">' + esc(t.reason) + '</div>'
      : a && (t.status === 'approved' || t.status === 'waiting')
        ? '<div class="sub">Approved until ' + esc(when(a.validTo)) + ' · execute it in Safe{Wallet} → Transactions</div>' : '';
    const b = busy.get(t.safeTxHash);
    return '<div class="row" data-row="' + t.safeTxHash + '"><div class="row-head">' +
      '<div class="nonce">#' + t.nonce + '</div>' +
      '<div style="min-width:0"><div class="title">' + esc(t.summary) + '</div><div class="sub">' + who + '</div>' + extra + '</div>' +
      '<div class="right"><span class="pill ' + cls + '">' + label + '</span>' +
      '<span class="sub">' + t.confirmations + '/' + (t.confirmationsRequired ?? '?') + ' signed</span></div>' +
      '<div class="right">' + actions + '</div></div>' +
      (reviewOpen.has(t.safeTxHash) ? reviewPanel(t, firstNeeding, q)
        : b ? '<div class="review"><div class="msg ' + b.cls + '">' + esc(b.text) + '</div></div>' : '') +
      '</div>';
  }).join('');
}

function reviewPanel(t, firstNeeding, q) {
  const b = busy.get(t.safeTxHash);
  const ahead = t.nonce - q.nonce;
  const prev = document.getElementById('w-' + t.safeTxHash);
  const chosen = prev ? Number(prev.value) : 86400;
  return '<div class="review">' +
    '<dl class="fields">' +
    '<dt>Token</dt><dd>' + esc(t.token.symbol || 'Unknown token') + ' <span class="mono muted">' + esc(t.token.address) + '</span></dd>' +
    '<dt>Recipient</dt><dd class="mono">' + esc(t.recipient) + '</dd>' +
    '<dt>Amount</dt><dd><b>' + esc(t.amountFormatted) + ' ' + esc(t.token.symbol || '') + '</b></dd>' +
    '<dt>Safe nonce</dt><dd>' + t.nonce + (ahead > 0 ? ' <span class="muted">(' + ahead + ' earlier transaction' + (ahead > 1 ? 's' : '') + ' must execute first)</span>' : '') + '</dd>' +
    '<dt>Safe transaction hash</dt><dd class="mono">' + esc(t.safeTxHash) + '</dd>' +
    '</dl>' +
    '<p class="check">✓ Verified from two sources: the Safe Transaction Service record hashes on-chain to this transaction hash.</p>' +
    (firstNeeding && firstNeeding.safeTxHash !== t.safeTxHash ? '<p class="msg">Transaction #' + firstNeeding.nonce + ' is still waiting for approval. This one cannot execute before it; choose a validity window long enough for it to clear.</p>' : '') +
    '<div class="controls">' +
    '<label class="muted" for="w-' + t.safeTxHash + '">Valid for</label>' +
    '<select id="w-' + t.safeTxHash + '">' +
    [[3600, '1 hour'], [6 * 3600, '6 hours'], [86400, '24 hours'], [3 * 86400, '3 days'], [7 * 86400, '7 days']]
      .map(([s, l]) => '<option value="' + s + '"' + (s === chosen ? ' selected' : '') + '>' + l + '</option>').join('') +
    '</select>' +
    '<button class="btn" data-sign="' + t.safeTxHash + '"' + (b && b.cls === 'wait' ? ' disabled' : '') + '>Sign on Ledger</button>' +
    '</div>' +
    (b ? '<div class="msg ' + b.cls + '">' + esc(b.text) + '</div>' : '') +
    '</div>';
}

async function sign(hash) {
  const sel = $('w-' + hash);
  const validForSeconds = Number(sel ? sel.value : 86400);
  busy.set(hash, {cls: 'wait', text: 'Confirm on your Ledger. Check every screen against the fields above: token, recipient, amount, validity, and the Safe transaction it is pinned to. Then approve on the device.'});
  renderQueue(queueData);
  try {
    const r = await api('approvals', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({safeTxHash: hash, validForSeconds})});
    if (r.ok && r.outcome === 'approved') {
      reviewOpen.delete(hash);
      busy.set(hash, {cls: 'ok', text: '✓ Approved on the Ledger (one-time signature #' + r.leaf + ') and recorded by the Guard. ' +
        'Execute the transaction in Safe{Wallet} → Transactions → Queue.'});
    } else if (r.ok && r.outcome === 'rejected') {
      busy.set(hash, {cls: 'bad', text: (r.reason === 'timeout' ? 'Timed out on the Ledger.' : 'Rejected on the Ledger.') + ' Nothing was signed.'});
    } else {
      busy.set(hash, {cls: 'bad', text: r.error || 'Approval failed.'});
    }
  } catch (e) {
    busy.set(hash, {cls: 'bad', text: e.message});
  }
  await refresh();
}

async function revoke(id) {
  try {
    await safeCall('sendTransactions', {txs: [{to: status.guard, value: '0', data: '0x4745760e' + id.slice(2)}]});
    banner('Revocation created. It takes effect once the Safe transaction executes; it needs no quantum approval.');
  } catch (e) {
    // closed or rejected in Safe{Wallet}: nothing to do
  }
  refresh();
}

// ── approvals ──
const A_STATUS = {active: 'ok', scheduled: 'info', used: 'muted', revoked: 'bad', expired: 'muted'};
function renderApprovals(r) {
  if (!r.approvals.length) {
    $('approvals').innerHTML = '<div class="empty">No pre-approvals for this Safe yet.</div>';
    return;
  }
  $('approvals').innerHTML = '<table><thead><tr><th>Payment</th><th class="hide-sm">Pinned to</th><th>Valid until</th>' +
    '<th class="hide-sm">Signature</th><th>Status</th><th></th></tr></thead><tbody>' +
    r.approvals.map(a => '<tr>' +
      '<td>' + (a.class === 'transfer'
        ? '<b>' + esc(a.amountFormatted) + ' ' + esc(a.token.symbol || '') + '</b><div class="sub">to <span class="mono">' + esc(short(a.recipient)) + '</span></div>'
        : esc(a.class) + ' approval') + '</td>' +
      '<td class="hide-sm">' + (a.safeTxHash ? 'Safe tx ' + (a.safeNonce !== undefined ? '#' + a.safeNonce : '<span class="mono">' + esc(short(a.safeTxHash)) + '</span>') : 'Any matching transfer') + '</td>' +
      '<td>' + esc(when(a.validTo)) + '</td>' +
      '<td class="hide-sm">XMSS #' + a.leaf + '</td>' +
      '<td><span class="pill ' + (A_STATUS[a.status] || 'muted') + '">' + esc(a.status) + '</span></td>' +
      '<td>' + ((a.status === 'active' || a.status === 'scheduled') ? '<button class="btn danger" data-revoke="' + a.id + '">Revoke</button>' : '') + '</td>' +
      '</tr>').join('') + '</tbody></table>';
}

// ── refresh + events ──
let refreshing = false;
async function refresh() {
  if (!safe || refreshing) return;
  refreshing = true;
  try {
    status = await api('status');
    if (status.error) throw new Error(status.error);
    renderStatus(status);
    if (status.isContract) {
      const [q, a] = await Promise.all([api('queue'), api('approvals')]);
      if (q.error) throw new Error(q.error);
      queueData = q;
      for (const h of [...busy.keys()]) {  // forget messages for transactions that left the queue
        if (!q.transactions.some(t => t.safeTxHash === h)) busy.delete(h);
      }
      // Don't rebuild the list under an open "Valid for" menu.
      if (!(document.activeElement && document.activeElement.tagName === 'SELECT')) renderQueue(q);
      if (!a.error) renderApprovals(a);
    }
  } catch (e) {
    banner('Could not reach the FermionWallet service: ' + e.message, true);
  } finally {
    refreshing = false;
  }
}

document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.review) {
    const h = t.dataset.review;
    reviewOpen.has(h) ? reviewOpen.delete(h) : reviewOpen.add(h);
    renderQueue(queueData);
  } else if (t.dataset.sign) {
    sign(t.dataset.sign);
  } else if (t.dataset.revoke) {
    revoke(t.dataset.revoke);
  } else if (t.getAttribute('role') === 'tab') {
    for (const name of ['queue', 'approvals', 'key']) {
      $('tab-' + name).setAttribute('aria-selected', String(t.id === 'tab-' + name));
      $('view-' + name).hidden = t.id !== 'tab-' + name;
    }
  }
});

connect();
</script>
</body>
</html>
