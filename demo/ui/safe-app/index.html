<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FermionGuard</title>
<link rel="icon" href="/safe-app/logo.svg" type="image/svg+xml">
<style>
  :root {
    --bg:#121312; --panel:#1c1c1c; --panel2:#242424; --text:#f6f7f9; --muted:#a1a3a7; --border:#303033;
    --accent:#12ff80; --accent-soft:#12ff8022; --on-accent:#121312;
    --ok:#4ade80; --bad:#f87171; --warn:#fbbf24; --info:#60a5fa;
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px 16px 40px; background:var(--bg); color:var(--text);
         font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:980px; margin:0 auto; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  header img { height:30px; width:auto; border-radius:6px; }
  header h1 { font-size:20px; margin:0; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px;
          font-size:12px; font-weight:600; white-space:nowrap; }
  .pill.ok { background:rgba(74,222,128,.12); color:var(--ok); }
  .pill.bad { background:rgba(248,113,113,.12); color:var(--bad); }
  .pill.warn { background:rgba(251,191,36,.12); color:var(--warn); }
  .pill.info { background:rgba(96,165,250,.12); color:var(--info); }
  .pill.muted { background:var(--panel2); color:var(--muted); }
  .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  @media (max-width:760px){ .cards{grid-template-columns:1fr;} }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px 16px; min-width:0; }
  .card h2 { font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin:0 0 6px; font-weight:600; }
  .card .big { font-size:18px; font-weight:700; }
  .mono { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12.5px; overflow-wrap:anywhere; }
  .muted { color:var(--muted); }
  .bar { height:6px; border-radius:3px; background:var(--panel2); margin-top:8px; overflow:hidden; }
  .bar > div { height:100%; background:var(--accent); }
  .bar.warn > div { background:var(--warn); } .bar.bad > div { background:var(--bad); }
  nav.tabs { display:flex; gap:4px; margin:20px 0 12px; border-bottom:1px solid var(--border); }
  nav.tabs button { background:none; border:0; color:var(--muted); font:600 14px system-ui,sans-serif;
                    padding:10px 14px; cursor:pointer; border-bottom:2px solid transparent; }
  nav.tabs button[aria-selected="true"] { color:var(--text); border-bottom-color:var(--accent); }
  .count { background:var(--panel2); color:var(--text); border-radius:999px; padding:0 7px; font-size:12px; margin-left:4px; }
  .list { display:flex; flex-direction:column; gap:8px; }
  .row { background:var(--panel); border:1px solid var(--border); border-radius:12px; }
  .row-head { display:grid; grid-template-columns:56px 1fr auto auto; gap:12px; align-items:center; padding:12px 16px; }
  @media (max-width:640px){
    .row-head{grid-template-columns:44px 1fr; } .row-head .right{grid-column:2;}
    /* A status label is long enough to set the row's minimum width on a phone and push
       the page into a horizontal scroll, so let it wrap here. */
    .row-head .pill{ white-space:normal; }
  }
  .nonce { font-weight:700; color:var(--muted); }
  /* A summary can carry a bare 42-character address, which would otherwise set the
     row's minimum width and push the whole page into a horizontal scroll on a phone. */
  .title { font-weight:600; overflow-wrap:anywhere; }
  .sub { color:var(--muted); font-size:12.5px; overflow-wrap:anywhere; }
  .right { display:flex; gap:8px; align-items:center; justify-content:flex-end; flex-wrap:wrap; }
  button.btn { background:var(--accent); color:var(--on-accent); border:0; border-radius:8px; padding:8px 14px;
               font:600 13.5px system-ui,sans-serif; cursor:pointer; }
  button.btn.ghost { background:transparent; color:var(--text); border:1px solid var(--border); }
  button.btn.danger { background:transparent; color:var(--bad); border:1px solid rgba(248,113,113,.4); }
  button.btn:disabled { opacity:.45; cursor:not-allowed; }
  .review { border-top:1px solid var(--border); padding:14px 16px 16px; }
  dl.fields { display:grid; grid-template-columns:160px 1fr; gap:6px 14px; margin:0 0 12px; }
  @media (max-width:640px){ dl.fields{grid-template-columns:1fr;} }
  dl.fields dt { color:var(--muted); }
  dl.fields dd { margin:0; }
  .check { color:var(--ok); font-size:13px; margin:0 0 12px; }
  .controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  select { background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:13.5px; }
  .msg { margin-top:12px; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); font-size:13px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg.ok { border-color:rgba(74,222,128,.4); color:var(--ok); }
  .msg.bad { border-color:rgba(248,113,113,.4); color:var(--bad); }
  .msg.wait { border-color:rgba(96,165,250,.4); color:var(--info); }
  .empty { text-align:center; padding:36px 16px; color:var(--muted); background:var(--panel); border:1px dashed var(--border); border-radius:12px; }
  table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:top; }
  th { color:var(--muted); font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; }
  tr:last-child td { border-bottom:0; }
  @media (max-width:760px){ .hide-sm{display:none;} }
  .banner { margin-bottom:14px; padding:12px 14px; border-radius:10px; border:1px solid rgba(251,191,36,.4); color:var(--warn); background:rgba(251,191,36,.06); }
  .banner.bad { border-color:rgba(248,113,113,.4); color:var(--bad); background:rgba(248,113,113,.06); }
  .banner.info { border-color:rgba(96,165,250,.4); color:var(--info); background:rgba(96,165,250,.06); }
  .banner .dismiss { float:right; margin-left:12px; background:none; border:0; color:inherit;
                     font:600 13px system-ui,sans-serif; cursor:pointer; }
  /* The default focus ring is a dark hairline, invisible on this dark surface. */
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  [hidden] { display:none !important; }
  /* A row that shares its nonce with the row above it: only one of them can ever
     execute, and nothing else on the row would say so. */
  .pill.conflict { background:rgba(251,191,36,.12); color:var(--warn); }
  /* The re-evaluation warning on an approval whose window is now too short for the
     queue ahead of it to clear. */
  .risk { margin-top:8px; padding:10px 12px; border-radius:8px; border:1px solid rgba(251,191,36,.4);
          background:rgba(251,191,36,.06); color:var(--warn); font-size:13px; }
  .risk .acts { margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; }
  /* The nonce override. Deliberately a full-screen modal and not a checkbox: skipping
     the queue is the one action here that spends a one-time signature on a transaction
     that may never be executable. */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:50;
           display:flex; align-items:flex-start; justify-content:center; overflow:auto; padding:24px 16px; }
  .modal-box { background:var(--panel); border:1px solid rgba(248,113,113,.5); border-radius:14px;
               padding:20px 22px 22px; max-width:640px; width:100%; }
  .modal-box h2 { margin:0 0 4px; font-size:18px; color:var(--bad); }
  .modal-box .lead { color:var(--muted); font-size:13px; margin:0 0 14px; }
  .modal-box p { margin:0 0 12px; }
  .modal-box .cost { border-left:3px solid var(--bad); padding-left:12px; }
  .modal-box label { display:block; margin:14px 0 6px; color:var(--muted); }
  .modal-box input[type=text] { background:var(--bg); color:var(--text); border:1px solid var(--border);
                                border-radius:8px; padding:9px 11px; font:600 15px ui-monospace,Menlo,monospace;
                                width:140px; }
  .modal-box .acts { margin-top:18px; display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/safe-app/logo.svg" alt="">
    <h1>FermionGuard</h1>
    <span class="pill muted" id="protection">Loading…</span>
  </header>

  <div class="banner" id="banner" role="status" hidden></div>
  <div class="banner info" id="notice" role="status" hidden></div>

  <!-- The full-screen nonce override lives here; it is position:fixed, so it covers
       the app wherever in the document it sits. -->
  <div id="override" hidden></div>

  <section id="main" hidden>
    <div class="cards">
      <div class="card">
        <h2>Protection</h2>
        <div class="big" id="c-protection">—</div>
        <div class="sub mono" id="c-guard"></div>
      </div>
      <div class="card">
        <h2>Quantum key</h2>
        <div class="big" id="c-leaves">—</div>
        <div class="bar" id="c-bar"><div style="width:0"></div></div>
        <div class="sub" id="c-admin"></div>
      </div>
      <div class="card">
        <h2>Safe</h2>
        <div class="big" id="c-safe-nonce">—</div>
        <div class="sub mono" id="c-safe"></div>
      </div>
    </div>

    <nav class="tabs" role="tablist" aria-label="FermionGuard sections">
      <button role="tab" id="tab-queue" aria-selected="true" aria-controls="view-queue"
              tabindex="0">Queue<span class="count" id="n-queue">0</span></button>
      <button role="tab" id="tab-approvals" aria-selected="false" aria-controls="view-approvals"
              tabindex="-1">Approvals</button>
      <button role="tab" id="tab-key" aria-selected="false" aria-controls="view-key"
              tabindex="-1">Key</button>
    </nav>

    <div id="view-queue" role="tabpanel" aria-labelledby="tab-queue" tabindex="0">
      <!-- Deliberately not a live region: the whole list is rebuilt every 4 seconds, and a
           screen reader would read the entire queue out again on every poll. The small
           per-row messages carry role="status" instead. -->
      <div class="list" id="queue"><div class="empty">Loading the queue…</div></div>
    </div>
    <div id="view-approvals" role="tabpanel" aria-labelledby="tab-approvals" tabindex="0" hidden>
      <div id="approvals"></div>
    </div>
    <div id="view-key" role="tabpanel" aria-labelledby="tab-key" tabindex="0" hidden>
      <div class="card"><dl class="fields" id="key"></dl></div>
    </div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const short = a => a ? a.slice(0, 6) + '…' + a.slice(-4) : '—';
// Every time in this app is UTC, in the Ledger's own format, because the whole point of
// the device screen is that you compare it with what the app shows. A local-time string
// here and "30 Sep 2026 18:23 UTC" on the device is a comparison nobody can make.
// Built by hand rather than with Intl, so the month is the device's three-letter form
// ("Sep", not the locale-dependent "Sept"/"sept.") and the strings compare character for
// character with the Ledger screen.
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const pad2 = n => String(n).padStart(2, '0');
const when = ts => { const d = new Date(ts * 1000); return pad2(d.getUTCDate()) + ' ' +
  MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear() + ' ' + pad2(d.getUTCHours()) + ':' +
  pad2(d.getUTCMinutes()) + ' UTC'; };

// ── Safe Apps protocol (what @safe-global/safe-apps-sdk sends over postMessage) ──
const SDK_VERSION = '9.1.0';
const pending = new Map();
window.addEventListener('message', ev => {
  if (ev.source !== window.parent || !ev.data || !pending.has(ev.data.id)) return;
  const {resolve, reject} = pending.get(ev.data.id);
  pending.delete(ev.data.id);
  ev.data.success ? resolve(ev.data.data) : reject(new Error(ev.data.error || 'request failed'));
});
function safeCall(method, params = undefined, timeoutMs = 0) {
  const id = Math.random().toString(16).slice(2) + Date.now().toString(16);
  return new Promise((resolve, reject) => {
    pending.set(id, {resolve, reject});
    window.parent.postMessage({id, method, params, env: {sdkVersion: SDK_VERSION}}, '*');
    if (timeoutMs) setTimeout(() => { if (pending.delete(id)) reject(new Error('timeout')); }, timeoutMs);
  });
}
const inSafeWallet = window.parent !== window;

let safe = null;           // address of the Safe this app is opened for
let status = null;         // /status response
let queueData = null;      // /queue response
const reviewOpen = new Set();
const busy = new Map();    // safeTxHash -> {cls, text}; a local overlay, shown only until
                           // the service reports the signing job on the row itself
// The Safe transactions whose out-of-order approval the operator has confirmed by
// typing the nonce. The service requires the nonce on the request too, so clearing this
// set is not a way past the rule — it only closes the review screen.
const overrideGranted = new Set();
const windowChoice = new Map();   // safeTxHash -> chosen validity window, in seconds
const keepWaiting = new Set();    // pre-approval ids whose expiry warning was accepted
let overrideFor = null;           // safeTxHash the override modal is open for

// Validity windows the operator can pick from. The service suggests a length derived
// from the queue ahead; these are the offers, and the smallest one that covers the
// suggestion is what the app pre-selects.
const WINDOWS = [[3600, '1 hour'], [6 * 3600, '6 hours'], [86400, '24 hours'],
                 [3 * 86400, '3 days'], [7 * 86400, '7 days']];
function suggestedWindow(t) {
  const want = t.suggestedSeconds || 86400;
  const offer = WINDOWS.find(([s]) => s >= want);
  return offer ? offer[0] : WINDOWS[WINDOWS.length - 1][0];
}
function chosenWindow(t) {
  return windowChoice.has(t.safeTxHash) ? windowChoice.get(t.safeTxHash) : suggestedWindow(t);
}
// Durations are estimates, so they read as estimates: "about 2.5 hours", never "9000 s".
function dur(s) {
  s = Math.max(0, Math.round(s));
  if (s >= 86400) { const d = s / 86400; return trim(d) + (d === 1 ? ' day' : ' days'); }
  if (s >= 3600) { const h = s / 3600; return trim(h) + (h === 1 ? ' hour' : ' hours'); }
  const m = Math.max(1, Math.round(s / 60));
  return m + (m === 1 ? ' minute' : ' minutes');
}
const trim = n => Number.isInteger(n) ? String(n) : n.toFixed(1);
const nonceList = ns => ns.map(n => '#' + n).join(', ');
// Why a row that nothing earlier is holding up still needs the override: it is a rival
// for its own nonce, and only one transaction can ever take a nonce.
const rivalReason = t => t.rivalHolds === 'approval'
  ? 'Nonce #' + t.nonce + ' already carries a quantum approval on another queued transaction.'
  : 'Another transaction was queued at nonce #' + t.nonce + ' before this one.';
// The one-time signature the device would spend next, as the Guard's own leaf counter
// reports it. Named in the override modal because that is the thing being risked.
const nextLeaf = () => status && status.key ? status.key.leavesUsed : null;
const api = (what, opts) => fetch('/api/v1/safes/' + safe + '/' + what, opts).then(r => r.json());

function banner(text, bad) {
  // role="status" makes this a live region, and renderStatus runs every 4 seconds: writing
  // the same string again is still a mutation, and a screen reader would read it out again.
  if ($('banner').textContent === text) return;
  $('banner').textContent = text;
  $('banner').className = 'banner' + (bad ? ' bad' : '');
  $('banner').hidden = !text;
}

// A separate slot for messages about something the operator just did. The banner above
// describes the Safe's state and is rewritten on every 4-second poll, which used to wipe
// "Revocation created…" a second or two after it appeared.
function notice(text) {
  if ($('notice').dataset.text === (text || '')) return;
  $('notice').dataset.text = text || '';
  $('notice').innerHTML = text
    ? '<button class="dismiss" data-dismiss="1" aria-label="Dismiss this message">Dismiss</button>' + esc(text)
    : '';
  $('notice').hidden = !text;
}

// ── connection to Safe{Wallet} (retried: Safe{Wallet} can be slow to answer) ──
let retry = 1000;
async function connect() {
  if (!inSafeWallet) {
    $('protection').textContent = 'Not in a Safe';
    banner('Open FermionGuard from Safe{Wallet}: Apps → FermionGuard.');
    return;
  }
  try {
    const info = await safeCall('getSafeInfo', undefined, 8000);
    safe = info.safeAddress;
    banner('');
    $('main').hidden = false;
    await refresh();
    setInterval(refresh, 4000);
  } catch (e) {
    // Distinguish "Safe{Wallet} has not answered yet" from "Safe{Wallet} answered with an
    // error": the second one does not get better by waiting, and its text is the only clue.
    banner(e.message === 'timeout'
      ? 'Waiting for Safe{Wallet}… If this does not clear, reload the app from Apps → FermionGuard.'
      : 'Safe{Wallet} could not tell FermionGuard which Safe this is: ' + e.message +
        '. Retrying; if it does not clear, reopen the app from Apps → FermionGuard.',
      e.message !== 'timeout');
    setTimeout(connect, retry);
    retry = Math.min(retry * 2, 8000);
  }
}

// ── status cards ──
function renderStatus(s) {
  const p = $('protection');
  if (!s.isContract) {
    p.className = 'pill bad'; p.textContent = 'Not a Safe on this chain';
    banner('No contract at ' + s.safe + ' on chain ' + s.chainId + '.', true);
    // Nothing will ever load the queue for this address, so don't leave "Loading…" up.
    $('queue').innerHTML = '<div class="empty">There is no Safe at this address on this chain, ' +
      'so there is no queue to show.</div>';
    return;
  }
  const k = s.key;
  if (s.protected && s.paused) {
    // Any single owner can pause, and the Guard then refuses everything but the owners'
    // safety calls — including transactions that already hold a valid pre-approval.
    p.className = 'pill bad'; p.textContent = 'Paused';
    $('c-protection').textContent = 'Paused by an owner';
    banner('This Safe is paused. The Guard refuses every transaction except the owners’ safety '
      + 'calls, whatever approvals exist, so nothing in the queue can execute. Any single owner can '
      + 'pause; unpausing needs the owner threshold and a timelock (requestUnpauseSafe, then '
      + 'unpauseSafe on the Guard). Approvals already granted keep running down their validity '
      + 'windows while it is paused.', true);
  } else if (s.protected && k && k.status === 'active' && k.leavesLeft <= 0) {
    p.className = 'pill bad'; p.textContent = 'Key exhausted';
    $('c-protection').textContent = 'Guard active, key exhausted';
    banner('The quantum key has used all ' + k.leavesTotal.toLocaleString() + ' of its one-time '
      + 'signatures. Nothing in the queue can be approved until the key is rotated, so every '
      + 'transfer this Safe has queued is held.', true);
  } else if (s.protected && k && k.status === 'active') {
    p.className = 'pill ok'; p.textContent = 'Protected';
    $('c-protection').textContent = 'Guard active';
    const pct = k.leavesUsed / k.leavesTotal;
    banner(pct >= .95
      ? 'The quantum key has only ' + k.leavesLeft.toLocaleString() + ' one-time signatures left of '
        + k.leavesTotal.toLocaleString() + '. Rotate it now: approvals stop entirely at zero.'
      : pct >= .8
        ? 'The quantum key has used ' + Math.round(100 * pct) + '% of its one-time signatures ('
          + k.leavesLeft.toLocaleString() + ' left). Plan a rotation.'
        : '');
  } else if (s.protected) {
    p.className = 'pill warn'; p.textContent = 'No active key';
    $('c-protection').textContent = 'Guard active, no key';
    // Not *every* transaction: the Guard can never block the owners' safety calls
    // (revoke, pause, and the emergency Guard removal) — that is what stops a Safe
    // with a lost key from being bricked. Everything that moves money is blocked.
    banner('The FermionGuard is installed but this Safe has no active quantum key, so every '
      + 'transaction that moves funds is blocked. Register or rotate a key. The owners’ safety '
      + 'calls — revoking an approval, pausing the Safe, and starting the emergency Guard '
      + 'removal — still go through.', true);
  } else {
    p.className = 'pill bad'; p.textContent = 'Not protected';
    $('c-protection').textContent = 'Not protected';
    banner(s.activeGuard
      ? 'This Safe uses a different Guard (' + s.activeGuard + '). FermionGuard approvals have no effect on it.'
      : 'This Safe is not protected by FermionGuard. Its transactions need only owner signatures.', !s.activeGuard);
  }
  $('c-guard').textContent = s.protected ? 'Guard ' + s.guard : (s.activeGuard ? 'Other guard ' + s.activeGuard : 'No guard');
  if (k) {
    const pct = k.leavesUsed / k.leavesTotal;
    $('c-leaves').textContent = k.leavesLeft.toLocaleString() + ' of ' + k.leavesTotal.toLocaleString() + ' signatures left';
    $('c-bar').className = 'bar' + (pct >= .95 ? ' bad' : pct >= .8 ? ' warn' : '');
    $('c-bar').firstElementChild.style.width = (100 * pct).toFixed(1) + '%';
    $('c-admin').innerHTML = 'Administrator <span class="mono">' + esc(short(k.admin)) + '</span> · ' + esc(k.status);
  } else {
    $('c-leaves').textContent = 'No key';
    $('c-admin').textContent = 'No quantum key registered for this Safe';
  }
  $('c-safe-nonce').textContent = 'Nonce ' + s.nonce + ' · ' + s.threshold +
    (s.ownerCount ? ' of ' + s.ownerCount : '') + ' owner signatures';
  $('c-safe').textContent = s.safe;
  $('key').innerHTML = k ? [
    ['Status', esc(k.status)],
    ['Administrator (Ledger)', '<span class="mono">' + esc(k.admin) + '</span>'],
    ['Key ID', '<span class="mono">' + esc(k.id) + '</span>'],
    ['XMSS root', '<span class="mono">' + esc(k.root) + '</span>'],
    ['Tree height', esc(k.treeHeight) + ' (' + k.leavesTotal.toLocaleString() + ' one-time signatures)'],
    ['Used / left', k.leavesUsed.toLocaleString() + ' / ' + k.leavesLeft.toLocaleString()],
    ['Registered', esc(when(k.createdAt))],
    ['Guard', '<span class="mono">' + esc(s.guard) + '</span>'],
  ].map(([a, b]) => '<dt>' + a + '</dt><dd>' + b + '</dd>').join('') : '<dt>Key</dt><dd>None registered</dd>';
}

// ── queue ──
const STATUS = {
  needs_approval: ['warn', 'Quantum approval required'],
  approved: ['ok', 'Ready to execute'],
  waiting: ['info', 'Approved · waiting for earlier nonce'],
  unsupported: ['muted', 'Not supported'],
  blocked: ['bad', 'Blocked by the Guard — cannot ever execute'],
  paused: ['bad', 'Safe paused — nothing can execute'],
  free: ['ok', 'No quantum approval needed'],
  mismatch: ['bad', 'Hash mismatch — do not sign'],
};
function protectedWithKey() {
  return status && status.protected && !status.paused && status.key &&
    status.key.status === 'active' && status.key.leavesLeft > 0;
}
// Why the Review button is not on a row that plainly needs approval.
function cannotApprove() {
  if (!status) return '';
  if (!status.protected) return '';
  if (status.paused) return 'This Safe is paused, so nothing can execute and approving would only '
    + 'spend a one-time signature against a running clock.';
  if (!status.key) return 'No quantum key is registered for this Safe, so nothing can be approved.';
  if (status.key.status !== 'active') return 'This Safe’s quantum key is ' + status.key.status +
    ', so nothing can be approved. Register or rotate a key.';
  if (status.key.leavesLeft <= 0) return 'The quantum key has no one-time signatures left, so nothing '
    + 'can be approved. Rotate the key.';
  return '';
}
// The queue is re-rendered every 4 seconds. Without this, a keyboard user could never
// keep focus on a row control long enough to press it.
function focusKey() {
  const a = document.activeElement;
  if (!a || !$('queue').contains(a)) return null;
  for (const k of ['review', 'sign', 'revoke', 'override', 'keep']) {
    if (a.dataset[k]) return '[data-' + k + '="' + a.dataset[k] + '"]';
  }
  return a.id ? '#' + CSS.escape(a.id) : null;
}

// What the service says is happening to this transaction right now. It comes from the
// service and not from this tab, so closing the tab while the Ledger is being read
// loses nothing: whoever opens the app next sees the same thing.
function jobMessage(j) {
  if (j.phase === 'device') return {cls: 'wait', text:
    'Confirm on your Ledger. Check every screen against the fields above: token, recipient, '
    + 'amount, validity, and the Safe transaction it is pinned to. Then approve on the device. '
    + 'This screen can be closed; the approval carries on without it.'};
  if (j.phase === 'simulating') return {cls: 'wait', text:
    'Signed on the Ledger with one-time signature #' + j.leaf + '. Asking the chain whether the '
    + 'Guard will accept it — nothing has been submitted yet.'};
  if (j.phase === 'submitting') return {cls: 'wait', text:
    'The simulation passed. Submitting the approval to the chain…'};
  if (j.outcome === 'approved') return {cls: 'ok', text:
    '✓ Approved on the Ledger (one-time signature #' + j.leaf + ') and recorded by the Guard'
    + (j.relayTx ? ' in transaction ' + j.relayTx : '')
    + (j.confirmations ? ' · ' + j.confirmations + (j.confirmations === 1 ? ' confirmation' : ' confirmations') : '')
    + '. Execute the transaction in Safe{Wallet} → Transactions → Queue.'};
  if (j.outcome === 'rejected') return {cls: 'bad', text:
    (j.reason === 'timeout' ? 'Timed out on the Ledger.' : 'Rejected on the Ledger.') + ' Nothing was signed.'};
  return {cls: 'bad', text: j.error || 'The approval failed.'};
}
function renderQueue(q) {
  if (!q) return;
  const refocus = focusKey();
  $('n-queue').textContent = q.transactions.length;
  if (!q.transactions.length) {
    $('queue').innerHTML = '<div class="empty">No pending transactions.<br>Create a transaction in Safe{Wallet} and sign it. ' +
      'It appears here for quantum approval.</div>';
    return;
  }
  const blocker = cannotApprove();
  $('queue').innerHTML = q.transactions.map(t => {
    const [cls, label] = STATUS[t.status] || ['muted', t.status];
    const who = t.kind === 'transfer' ? 'to <span class="mono">' + esc(t.recipient) + '</span>' : '';
    const a = t.approval;
    const job = t.signing;
    const working = job && job.phase !== 'done';
    let actions = '';
    // The Authorize action sits on the lowest unapproved nonce and nowhere else; every
    // other row that needs approval offers the override instead. Which is which is the
    // service's answer (t.authorize), and the service refuses an out-of-order approval
    // that does not carry the nonce the operator typed — so this is where the rule is
    // shown, not where it is enforced.
    if (working) {
      actions = '<button class="btn" disabled>Signing…</button>';
    } else if (t.authorize === 'direct' && protectedWithKey()) {
      actions = '<button class="btn" data-review="' + t.safeTxHash + '">' + (reviewOpen.has(t.safeTxHash) ? 'Close' : 'Review') + '</button>';
    } else if (t.authorize === 'override' && protectedWithKey()) {
      actions = overrideGranted.has(t.safeTxHash)
        ? '<button class="btn danger" data-review="' + t.safeTxHash + '">' + (reviewOpen.has(t.safeTxHash) ? 'Close' : 'Review out of order') + '</button>'
        : '<button class="btn ghost" data-override="' + t.safeTxHash + '">Authorize out of order…</button>';
    } else if (a && (a.status === 'active' || a.status === 'scheduled')) {
      // Revoking is an escape call, so it works even while the Safe is paused — which is
      // exactly when someone is most likely to want it.
      actions = '<button class="btn danger" data-revoke="' + a.id + '">Revoke</button>';
    }
    let extra = '';
    if (t.reason) extra += '<div class="sub">' + esc(t.reason) + '</div>';
    if (t.status === 'needs_approval' && blocker) extra += '<div class="sub">' + esc(blocker) + '</div>';
    // Why this row has no Authorize button. Without it the row looks the same as one
    // that is simply waiting for someone to get to it.
    if (t.authorize === 'override' && !overrideGranted.has(t.safeTxHash) && !blocker) {
      extra += '<div class="sub">' + (t.earlierUnapprovedNonces.length
        ? 'Not next in line: ' + nonceList(t.earlierUnapprovedNonces) + ' must be approved and '
          + 'executed first, because the Safe executes in strict nonce order. Approving this one '
          + 'now spends a one-time signature that cannot be used until they clear.'
        : rivalReason(t) + ' Only one of them can ever take this nonce, so approving this row '
          + 'risks spending a one-time signature that can never be used.')
        + '</div>';
    }
    // An approval that ran out, or was revoked, is the most expensive thing that can
    // happen quietly: the one-time signature is gone either way. Say so on the row.
    if (t.status === 'needs_approval' && a && (a.status === 'expired' || a.status === 'revoked')) {
      extra += '<div class="sub">A previous approval (one-time signature #' + a.leaf + ') ' +
        (a.status === 'expired' ? 'expired at ' + esc(when(a.validTo)) + ' without being executed'
                                : 'was revoked') +
        '. That signature is spent and cannot be recovered; approving again spends another one.</div>';
    }
    if (a && t.status === 'approved') {
      extra += '<div class="sub">Approved until ' + esc(when(a.validTo)) +
        ' · execute it in Safe{Wallet} → Transactions</div>';
    }
    if (a && t.status === 'waiting') {
      extra += '<div class="sub">Approved until ' + esc(when(a.validTo)) +
        ' · it cannot execute until every lower nonce has, and if the window runs out first the ' +
        'one-time signature is spent for nothing</div>';
    }
    // Re-evaluation: the queue ahead of an already-approved row changed, and its window
    // no longer covers it. The service recomputes this on every poll, so a rejected or
    // replaced earlier nonce shows up here without anyone asking.
    let risk = '';
    if (t.windowRisk && a && !keepWaiting.has(a.id)) {
      const r = t.windowRisk;
      risk = '<div class="risk" role="status">Nonce ' + nonceList(t.earlierUnapprovedNonces) +
        ' still pending, estimated about ' + dur(r.aheadSeconds) + ' to clear; your window ends in ' +
        dur(r.remainingSeconds) + '. This approval will likely expire unexecuted, and one-time ' +
        'signature #' + r.leaf + ' is spent either way.' +
        '<div class="acts"><button class="btn danger" data-revoke="' + a.id + '">Revoke now</button>' +
        '<button class="btn ghost" data-keep="' + a.id + '">Keep waiting</button></div></div>';
    }
    const b = job ? jobMessage(job) : busy.get(t.safeTxHash);
    return '<div class="row" data-row="' + t.safeTxHash + '"><div class="row-head">' +
      '<div class="nonce">#' + t.nonce + '</div>' +
      '<div style="min-width:0"><div class="title">' + esc(t.summary) + '</div><div class="sub">' + who + '</div>' + extra + '</div>' +
      '<div class="right"><span class="pill ' + cls + '">' + label + '</span>' +
      (t.conflictsWithAbove ? '<span class="pill conflict">Conflicts with the row above</span>' : '') +
      '<span class="sub">' + t.confirmations + '/' + (t.confirmationsRequired ?? '?') + ' signed</span></div>' +
      '<div class="right">' + actions + '</div></div>' +
      (risk ? '<div class="review" style="border-top:0;padding-top:0">' + risk + '</div>' : '') +
      (reviewOpen.has(t.safeTxHash) ? reviewPanel(t, q, b)
        : b ? '<div class="review"><div class="msg ' + b.cls + '" role="status">' + esc(b.text) + '</div></div>' : '') +
      '</div>';
  }).join('');
  if (refocus) {
    const again = $('queue').querySelector(refocus);
    if (again) again.focus();
  }
}

function reviewPanel(t, q, b) {
  const ahead = t.nonce - q.nonce;
  const chosen = chosenWindow(t);
  const working = t.signing && t.signing.phase !== 'done';
  return '<div class="review">' +
    (overrideGranted.has(t.safeTxHash)
      ? '<p class="msg bad">Out-of-order approval confirmed for nonce #' + t.nonce + '. ' +
        (t.earlierUnapprovedNonces.length
          ? 'Nonce ' + nonceList(t.earlierUnapprovedNonces) + ' must still be approved and executed ' +
            'before this can, and the validity window below starts running the moment you sign.'
          : rivalReason(t) + ' Only one of the two can ever execute.') + '</p>'
      : '') +
    '<dl class="fields">' +
    '<dt>Token</dt><dd>' + esc(t.token.symbol || 'Unknown token') + ' <span class="mono muted">' + esc(t.token.address) + '</span></dd>' +
    '<dt>Recipient</dt><dd class="mono">' + esc(t.recipient) + '</dd>' +
    '<dt>Amount</dt><dd><b>' + esc(t.amountFormatted) + ' ' + esc(t.token.symbol || '') + '</b></dd>' +
    '<dt>Safe nonce</dt><dd>' + t.nonce + (ahead > 0 ? ' <span class="muted">(' + ahead + ' earlier transaction' + (ahead > 1 ? 's' : '') + ' must execute first)</span>' : '') + '</dd>' +
    '<dt>Safe transaction hash</dt><dd class="mono">' + esc(t.safeTxHash) + '</dd>' +
    '</dl>' +
    // One source, checked against the chain — not two. The Transaction Service supplies
    // the fields; the Safe contract is asked whether they really produce this hash. That
    // is what makes the displayed fields the ones the owners signed and the ones the
    // approval will be pinned to. It does not independently confirm that the transaction
    // exists: the app has no second feed of the queue.
    '<p class="check">✓ The Safe itself confirms these fields: the Safe Transaction Service supplied ' +
    'them, and the Safe contract hashes them, on-chain, to exactly this transaction hash. The approval ' +
    'will be pinned to that hash, so it can authorize no other transaction than the one shown here.</p>' +
    '<div class="controls">' +
    '<label class="muted" for="w-' + t.safeTxHash + '">Valid for</label>' +
    windowSelect('w-' + t.safeTxHash, chosen) +
    // The Ledger shows absolute UTC times, so the app must too — otherwise there is
    // nothing on this screen to compare the device's "To …" line against.
    '<span class="muted">until about <b>' + esc(when((q.now || Math.floor(Date.now() / 1000)) + chosen)) +
    '</b>, which is what the Ledger will show</span>' +
    '<button class="btn" data-sign="' + t.safeTxHash + '"' + (working ? ' disabled' : '') + '>Sign on Ledger</button>' +
    '</div>' +
    windowAdvice(t, chosen) +
    (b ? '<div class="msg ' + b.cls + '" role="status">' + esc(b.text) + '</div>' : '') +
    '</div>';
}

function windowSelect(id, chosen) {
  return '<select id="' + id + '">' + WINDOWS
    .map(([s, l]) => '<option value="' + s + '"' + (s === chosen ? ' selected' : '') + '>' + l + '</option>')
    .join('') + '</select>';
}

// The suggested window is not a flat minimum: it is the estimated time for everything
// queued ahead of this row to clear, plus a slot for this transaction and the policy
// margin. Say what it is built from, because the operator is being asked to accept it.
function windowAdvice(t, chosen) {
  const suggestion = suggestedWindow(t);
  const ahead = t.earlierUnapprovedNonces.length;
  const basis = ahead
    ? 'Suggested: ' + WINDOWS.find(([s]) => s === suggestion)[1] + ' — ' + ahead +
      ' earlier queued nonce' + (ahead > 1 ? 's' : '') + ' (' + nonceList(t.earlierUnapprovedNonces) +
      ') must clear first, estimated at about ' + dur(t.aheadSeconds) + ', plus the policy margin.'
    : 'Suggested: ' + WINDOWS.find(([s]) => s === suggestion)[1] +
      ' — nothing is queued ahead of this transaction, so this is one execution slot plus the policy margin.';
  const short = chosen < t.aheadSeconds
    ? ' <b>Your window (' + dur(chosen) + ') is shorter than the queue ahead of it is estimated to take (' +
      dur(t.aheadSeconds) + '), so this approval will most likely expire unexecuted' +
      (nextLeaf() !== null ? ' and burn one-time signature #' + nextLeaf() : '') + '.</b>'
    : '';
  return '<p class="sub" style="margin:10px 0 0">' + basis + ' These are estimates, not promises.' + short + '</p>';
}

// ── the nonce override (full screen, typed confirmation) ──
// The specification is explicit that this is a modal and not a checkbox, and that the
// operator types the nonce rather than clicking OK. The typed value is also what the
// service requires on the request, so there is nothing here to click past.
function renderOverride() {
  const box = $('override');
  if (!overrideFor || !queueData) { box.hidden = true; box.innerHTML = ''; overrideFor = null; return; }
  const t = queueData.transactions.find(x => x.safeTxHash === overrideFor);
  if (!t || t.authorize !== 'override') { closeOverride(); return; }
  const chosen = chosenWindow(t);
  const earlier = t.earlierUnapprovedNonces;
  const leaf = nextLeaf();
  const burned = leaf === null ? 'a one-time signature is burned'
    : 'one-time signature #' + leaf + ' of ' + status.key.leavesTotal.toLocaleString() + ' is burned';
  const cost = earlier.length
    ? 'Nonce ' + nonceList(earlier) + ' ' + (earlier.length > 1 ? 'are' : 'is') + ' still unapproved. ' +
      'This approval cannot execute until ' + (earlier.length > 1 ? 'they clear' : 'it clears') + ', and its ' +
      'validity window starts burning the moment you sign. The queue ahead is estimated at about ' +
      dur(t.aheadSeconds) + '; you have chosen ' + dur(chosen) + '. If the queue ahead takes longer than ' +
      'that, this approval expires unexecuted and <b>' + burned + '</b>.'
    : rivalReason(t) + ' Only one of the two can ever take this nonce. If the other one executes, ' +
      'this approval can never be used and <b>' + burned + '</b>.';
  const ok = chosen >= t.aheadSeconds;
  box.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="ov-title">' +
    '<div class="modal-box">' +
    '<h2 id="ov-title">Authorize out of order</h2>' +
    '<p class="lead">Safe nonce #' + t.nonce + ' · ' + esc(t.amountFormatted) + ' ' +
      esc(t.token.symbol || '') + ' to <span class="mono">' + esc(t.recipient) + '</span></p>' +
    '<p class="cost">' + cost + '</p>' +
    '<div class="controls"><label class="muted" for="ov-window">Valid for</label>' +
    windowSelect('ov-window', chosen) +
    '<span class="muted">until about <b>' +
      esc(when((queueData.now || Math.floor(Date.now() / 1000)) + chosen)) + '</b></span></div>' +
    (ok ? '' : '<p class="msg bad" style="margin-top:12px">This window is shorter than the queue ahead ' +
      'of it is estimated to take. Pick a longer one, or expect to lose the signature.</p>') +
    '<label for="ov-type">Type the nonce (<b>' + t.nonce + '</b>) to confirm you accept this cost</label>' +
    '<input id="ov-type" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" ' +
      'aria-describedby="ov-title" value="' + esc($('ov-type') ? $('ov-type').value : '') + '">' +
    '<div class="acts">' +
    '<button class="btn ghost" data-ov-cancel="1">Cancel</button>' +
    '<button class="btn danger" data-ov-go="' + t.safeTxHash + '"' +
      (($('ov-type') && $('ov-type').value.trim() === String(t.nonce)) ? '' : ' disabled') +
      '>Authorize out of order</button>' +
    '</div></div></div>';
  box.hidden = false;
  const input = $('ov-type');
  if (input && document.activeElement !== input) {
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  }
}
function openOverride(hash) { overrideFor = hash; renderOverride(); }
function closeOverride() {
  overrideFor = null;
  $('override').hidden = true;
  $('override').innerHTML = '';
}

async function sign(hash) {
  const t = queueData && queueData.transactions.find(x => x.safeTxHash === hash);
  const sel = $('w-' + hash);
  const validForSeconds = Number(sel ? sel.value : (t ? chosenWindow(t) : 86400));
  const body = {safeTxHash: hash, validForSeconds};
  // The nonce the operator typed into the override modal travels with the request: the
  // service refuses an out-of-order approval without it.
  if (t && t.authorize === 'override' && overrideGranted.has(hash)) body.overrideNonce = t.nonce;
  busy.set(hash, {cls: 'wait', text: 'Asking the Guard whether this approval can be recorded at all, ' +
    'before the Ledger is asked to spend a one-time signature…'});
  renderQueue(queueData);
  try {
    const r = await api('approvals', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)});
    if (r.ok && r.outcome === 'pending') {
      // From here the service owns the flow, and the row reports it. This tab may be
      // closed without losing the result.
      busy.set(hash, jobMessage(r.job));
    } else {
      busy.set(hash, {cls: 'bad', text: r.error || 'Approval failed.'});
    }
  } catch (e) {
    busy.set(hash, {cls: 'bad', text: e.message});
  }
  await refresh();
}

async function revoke(id) {
  try {
    await safeCall('sendTransactions', {txs: [{to: status.guard, value: '0', data: '0x4745760e' + id.slice(2)}]});
    // The Guard never blocks this call, but Safe{Wallet} still queues it as an ordinary
    // Safe transaction — which means it lands *behind* everything already queued,
    // including the transfer it is meant to cancel. Say so: a revocation the operator
    // believes is in force, sitting behind the payment, is the worst outcome here.
    notice('A revocation has been created in Safe{Wallet}. It needs no quantum approval, but it is '
      + 'an ordinary Safe transaction, so Safe{Wallet} gives it the next free nonce and it takes '
      + 'effect only once it executes — after every transaction already queued ahead of it, '
      + 'including the very one it revokes. It does not stop that payment. To stop it now, from '
      + 'their own wallet and with no Safe transaction at all, any owner or the Quantum '
      + 'Administrator can call revokePreApproval on the Guard, and any owner can call pauseSafe, '
      + 'which blocks everything until the owner threshold unpauses.');
  } catch (e) {
    // closed or rejected in Safe{Wallet}: nothing to do
  }
  refresh();
}

// ── approvals ──
const A_STATUS = {active: 'ok', scheduled: 'info', used: 'muted', revoked: 'bad', expired: 'muted'};
function renderApprovals(r) {
  if (!r.approvals.length) {
    $('approvals').innerHTML = '<div class="empty">No pre-approvals for this Safe yet.</div>';
    return;
  }
  $('approvals').innerHTML = '<table><thead><tr><th>Payment</th><th class="hide-sm">Pinned to</th><th>Valid until</th>' +
    '<th class="hide-sm">Signature</th><th>Status</th><th></th></tr></thead><tbody>' +
    r.approvals.map(a => '<tr>' +
      '<td>' + (a.class === 'transfer'
        ? '<b>' + esc(a.amountFormatted) + ' ' + esc(a.token.symbol || '') + '</b><div class="sub">to <span class="mono">' + esc(short(a.recipient)) + '</span></div>'
        : esc(a.class) + ' approval') + '</td>' +
      '<td class="hide-sm">' + (a.safeTxHash ? 'Safe tx ' + (a.safeNonce !== undefined ? '#' + a.safeNonce : '<span class="mono">' + esc(short(a.safeTxHash)) + '</span>') : 'Any matching transfer') + '</td>' +
      '<td>' + esc(when(a.validTo)) + '</td>' +
      '<td class="hide-sm">XMSS #' + a.leaf + '</td>' +
      '<td><span class="pill ' + (A_STATUS[a.status] || 'muted') + '">' + esc(a.status) + '</span></td>' +
      '<td>' + ((a.status === 'active' || a.status === 'scheduled') ? '<button class="btn danger" data-revoke="' + a.id + '">Revoke</button>' : '') + '</td>' +
      '</tr>').join('') + '</tbody></table>';
}

// ── refresh + events ──
let refreshing = false;
async function refresh() {
  if (!safe || refreshing) return;
  refreshing = true;
  try {
    status = await api('status');
    if (status.error) throw new Error(status.error);
    renderStatus(status);
    if (status.isContract) {
      const [q, a] = await Promise.all([api('queue'), api('approvals')]);
      if (q.error) throw new Error(q.error);
      queueData = q;
      for (const h of [...busy.keys()]) {
        const row = q.transactions.find(t => t.safeTxHash === h);
        // Forget the local overlay once the transaction has left the queue, or once the
        // service reports the job itself — which is the version every tab agrees on.
        if (!row || row.signing) busy.delete(h);
      }
      for (const t of q.transactions) {
        if (t.signing && t.signing.outcome === 'approved') {
          reviewOpen.delete(t.safeTxHash);
          overrideGranted.delete(t.safeTxHash);
        }
      }
      // Don't rebuild the list under an open "Valid for" menu.
      if (!(document.activeElement && document.activeElement.tagName === 'SELECT')) renderQueue(q);
      if (overrideFor) {
        // If someone else approved the earlier nonce while this modal was open, there is
        // nothing left to override. Close it rather than redrawing under the operator's
        // cursor on every poll.
        const row = q.transactions.find(x => x.safeTxHash === overrideFor);
        if (!row || row.authorize !== 'override') closeOverride();
      }
      if (!a.error) renderApprovals(a);
    }
  } catch (e) {
    banner('Could not reach the FermionGuard service: ' + e.message +
      '. Nothing below is being updated; retrying every few seconds.', true);
    // Without this the panel is simply blank, which reads as "nothing to approve".
    if (!queueData) $('queue').innerHTML = '<div class="empty">The queue could not be loaded.<br>' +
      esc(e.message) + '</div>';
  } finally {
    refreshing = false;
  }
}

const TABS = ['queue', 'approvals', 'key'];
function selectTab(name, moveFocus) {
  for (const n of TABS) {
    const on = n === name;
    $('tab-' + n).setAttribute('aria-selected', String(on));
    $('tab-' + n).tabIndex = on ? 0 : -1;   // one stop for the whole tab strip (ARIA tabs)
    $('view-' + n).hidden = !on;
  }
  if (moveFocus) $('tab-' + name).focus();
}

document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.dismiss) {
    notice('');
  } else if (t.dataset.review) {
    const h = t.dataset.review;
    reviewOpen.has(h) ? reviewOpen.delete(h) : reviewOpen.add(h);
    renderQueue(queueData);
  } else if (t.dataset.sign) {
    sign(t.dataset.sign);
  } else if (t.dataset.revoke) {
    revoke(t.dataset.revoke);
  } else if (t.dataset.override) {
    openOverride(t.dataset.override);
  } else if (t.dataset.ovCancel) {
    closeOverride();
    renderQueue(queueData);
  } else if (t.dataset.ovGo) {
    const h = t.dataset.ovGo;
    const row = queueData.transactions.find(x => x.safeTxHash === h);
    const typed = $('ov-type') ? $('ov-type').value.trim() : '';
    // Belt and braces: the button is disabled until the nonce is typed, and the service
    // refuses the approval without it, but never act on a modal that disagrees with the row.
    if (!row || typed !== String(row.nonce)) return;
    overrideGranted.add(h);
    reviewOpen.add(h);
    closeOverride();
    renderQueue(queueData);
  } else if (t.dataset.keep) {
    keepWaiting.add(t.dataset.keep);
    renderQueue(queueData);
  } else if (t.getAttribute('role') === 'tab') {
    selectTab(t.id.slice(4));
  }
});

// Keep the "until about …" line and the window advice honest while the picker is being
// changed, in the review panel and in the override modal alike.
document.addEventListener('change', e => {
  if (e.target.tagName !== 'SELECT') return;
  if (e.target.id === 'ov-window') {
    if (overrideFor) windowChoice.set(overrideFor, Number(e.target.value));
    renderOverride();
    return;
  }
  if (e.target.id.startsWith('w-')) windowChoice.set(e.target.id.slice(2), Number(e.target.value));
  renderQueue(queueData);
});

// The typed confirmation: nothing enables the override button but the nonce itself.
document.addEventListener('input', e => {
  if (e.target.id !== 'ov-type' || !overrideFor) return;
  const row = queueData.transactions.find(x => x.safeTxHash === overrideFor);
  const go = document.querySelector('[data-ov-go]');
  if (go && row) go.disabled = e.target.value.trim() !== String(row.nonce);
});

// Escape closes the override without approving anything.
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && overrideFor) { closeOverride(); renderQueue(queueData); }
});

// ARIA tabs: the strip is one tab stop, and the arrow keys move between the tabs.
$('tab-queue').parentElement.addEventListener('keydown', e => {
  const i = TABS.indexOf(document.activeElement.id.slice(4));
  if (i < 0) return;
  const to = e.key === 'ArrowRight' ? (i + 1) % TABS.length
    : e.key === 'ArrowLeft' ? (i + TABS.length - 1) % TABS.length
    : e.key === 'Home' ? 0 : e.key === 'End' ? TABS.length - 1 : -1;
  if (to < 0) return;
  e.preventDefault();
  selectTab(TABS[to], true);
});

connect();
</script>
</body>
</html>
