[profile.default]
# Pinned so a release tag always rebuilds byte-identical binaries (release.yml
# ships foundry.toml for reproduction). Bump deliberately.
solc_version = "0.8.37"
src = "src"
out = "out"
libs = ["lib"]
ffi = true
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
    { access = "read", path = "./test/vectors" },
    { access = "read", path = "./test/mldsa" },
    { access = "read-write", path = "./demo-state" },
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
